<!doctype html>
<html lang="es">
<!-- HERRAMIENTA: hornea la hoja de PARTES DEL DESPIECE desde modelos 3D low-poly.
     - Abrir en browser (con el server del repo) para VER/tunear las piezas.
     - `npx electron tools/bake_partes_run.js` la exporta a assets/world/explosions/partes.png

     POR QUE EXISTE: hasta ahora el escombro eran RECTANGULOS ROTADOS. A 8 px un rectangulo es
     un rectangulo — el avion se rompia en cuadrados. Las piezas salen del MISMO pipeline que los
     aviones (tools/bake_planes.html): las mismas primitivas, las mismas luces y el mismo
     atardecer, asi que un ala arrancada es el ala del avion y no un icono aparte.

     FORMATO: una FILA por pieza, una COLUMNA por giro (yaw). El juego le suma su propia rotacion
     en el plano (`o.spin`), asi que la hoja solo tiene que dar la silueta desde varios lados —
     entre las dos, la pieza tumba de verdad.

     SE HORNEA EN GRIS NEUTRO, no en el camo del avion: el color lo pone la RECETA
     (data/despiece.js) al dibujar. Asi la misma ala sirve para el A-4, para el Harrier y para
     cualquier avion que entre despues, y las piezas quedan disponibles para escombro que no es
     de avion sin re-hornear nada. -->

<head>
  <meta charset="utf-8">
  <title>bake_partes — RASANTE</title>
  <style>
    body { background: #10161b; color: #93a7ab; font-family: ui-monospace, Menlo, monospace; padding: 20px; }
    h2 { color: #e8a33d; font-size: 14px; margin: 18px 0 6px; }
    canvas.sheet { image-rendering: pixelated; border: 1px solid #2a363d; display: block; }
    p.n { font-size: 12px; margin: 4px 0 0; color: #6f7d82; }
  </style>
</head>

<body>
  <div id="out"></div>
  <script src="../src/vendor/three.global.js"></script>
  <script>
    'use strict';

    // TAMAÑO DEL FRAME. El escombro se dibuja como mucho a 26 px de MUNDO (el tope de
    // render/world.js), y el juego corre con buffer 2x -> 52 px de pantalla. Con 48 de fuente la
    // pieza nunca se estira: se dibuja a escala 1 o menos, que es donde el pixel art se ve limpio.
    const FW = 48, FH = 48;
    // GIROS por columna. Ocho alcanzan: la pieza ademas rota en el plano con `o.spin`, asi que
    // esto solo tiene que contestar "desde que lado la estoy viendo".
    const YAWS = [0, 45, 90, 135, 180, 225, 270, 315];

    // GRIS NEUTRO con tres valores. El color final lo pone la receta; lo que la hoja aporta es el
    // VOLUMEN — que la pieza tenga cara iluminada y cara en sombra es lo que la separa de un rect.
    const CLARO = '#c3c9cd', MEDIO = '#9aa2a7', OSCURO = '#6b7378', NEGRO = '#3a4145';
    const VIDRIO = '#cfe8f2';

    function makeRenderer() {
      const r = new THREE.WebGLRenderer({ antialias: false, alpha: true });
      r.setSize(FW, FH, false);
      return r;
    }
    // MISMAS LUCES que los aviones (bake_planes.html): si el escombro se iluminara distinto, se
    // leeria como de otro juego justo en el momento en que esta al lado del avion que lo solto.
    function makeScene() {
      const sc = new THREE.Scene();
      sc.add(new THREE.AmbientLight(0xaebccc, 1.5));
      const dl = new THREE.DirectionalLight(0xe8c07a, 1.6); dl.position.set(-3, 5, 4); sc.add(dl);
      const rim = new THREE.DirectionalLight(0xb06a35, 0.5); rim.position.set(2, 1, -4); sc.add(rim);
      return sc;
    }
    // CAMARA fija que encuadra una caja de ~3.2 unidades. Cada pieza se modela para ocupar eso,
    // asi que todas salen a la misma escala relativa: un ala tiene que verse mas grande que un
    // panel, y eso se consigue modelando, no escalando la camara por pieza.
    function makeCam() {
      const cam = new THREE.PerspectiveCamera(26, FW / FH, 0.5, 100);
      cam.position.set(0, 1.5, 5.9); cam.lookAt(0, 0, 0);
      return cam;
    }

    // ---------- PRIMITIVAS (las mismas de bake_planes.html) ----------
    const MAT = c => new THREE.MeshLambertMaterial({ color: c });
    const add = (g, geo, c, x, y, z, rx, ry, rz) => {
      const m = new THREE.Mesh(geo, MAT(c));
      m.position.set(x, y, z);
      if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry; if (rz) m.rotation.z = rz;
      g.add(m); return m;
    };
    const B = (g, w, h, d, c, x, y, z, ry) =>
      add(g, new THREE.BoxGeometry(w, h, d), c, x, y, z, 0, ry || 0, 0);
    const CYL = (g, rT, rB, len, c, x, y, z, seg) =>
      add(g, new THREE.CylinderGeometry(rT, rB, len, seg || 10), c, x, y, z, Math.PI / 2);
    const CONE = (g, r, len, c, x, y, z, back, seg) =>
      add(g, new THREE.ConeGeometry(r, len, seg || 10), c, x, y, z, back ? Math.PI / 2 : -Math.PI / 2);
    const DOME = (g, r, c, x, y, z, sx, sy, sz) => {
      const m = add(g, new THREE.SphereGeometry(r, 10, 7), c, x, y, z);
      m.scale.set(sx || 1, sy || 1, sz || 1); return m;
    };
    /** PLANTA extruida en grosor vertical — la que da bordes en flecha CONTINUOS. */
    function PLATE(g, pts, thick, c, x, y, z) {
      const sh = new THREE.Shape();
      sh.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) sh.lineTo(pts[i][0], pts[i][1]);
      sh.closePath();
      const m = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: thick, bevelEnabled: false }), MAT(c));
      m.rotation.x = -Math.PI / 2;
      const grp = new THREE.Group();
      grp.add(m); grp.position.set(x, y, z); g.add(grp);
      return grp;
    }

    /** BORDE DESGARRADO: dientes irregulares sobre el corte. Es lo que separa "pieza arrancada"
     *  de "pieza desmontada" — sin esto el ala se lee como un ala de maqueta, prolija. Los
     *  dientes son DETERMINISTAS (indice, no azar): la hoja tiene que salir igual cada horneada. */
    function desgarro(g, largo, alto, c, x, y, z, eje) {
      for (let i = 0; i < 7; i++) {
        const t = (i / 6 - 0.5) * largo;
        const d = 0.08 + ((i * 7) % 5) * 0.05;             // profundidad del diente
        const h = alto * (0.5 + ((i * 3) % 4) * 0.16);
        if (eje === 'z') B(g, d * 2, h, 0.1, c, x + d, y, z + t);
        else B(g, 0.1, h, d * 2, c, x + t, y, z + d);
      }
    }

    // ================== LAS PIEZAS ==================
    // Cada una se modela para ocupar ~3.2 unidades en su lado mayor. El ORDEN de esta tabla es el
    // de las filas de la hoja, y `data/despiece.js` lo repite: si se agrega una pieza va AL FINAL,
    // o se corren todas las filas y el escombro pasa a ser otro.
    const PIEZAS = {
      // ALA arrancada de raiz: la mas reconocible de todas y la mas grande. Delta recortado con
      // flecha, borde de ataque limpio y la RAIZ desgarrada — por ahi se partio.
      ala(g) {
        PLATE(g, [[0, 1.15], [1.75, 0.25], [1.75, -0.35], [0, -0.95]], 0.11, MEDIO, -0.5, 0, 0);
        PLATE(g, [[0, 1.05], [1.6, 0.22], [1.6, -0.3], [0, -0.85]], 0.05, CLARO, -0.5, 0.08, 0);
        B(g, 0.16, 0.2, 1.5, OSCURO, -0.5, 0, 0.1);        // larguero asomando en la raiz
        desgarro(g, 1.9, 0.26, OSCURO, -0.56, 0, 0.1, 'z');
      },
      // DERIVA: la aleta vertical. Silueta inconfundible aunque mida cuatro pixeles.
      deriva(g) {
        const p = PLATE(g, [[0, 0.85], [1.5, 0.5], [1.5, -0.05], [0, -0.7]], 0.1, MEDIO, 0, -0.7, 0);
        p.rotation.z = Math.PI / 2;
        B(g, 0.14, 0.5, 1.2, OSCURO, 0, -0.72, 0.1);       // el muñon que quedo del fuselaje
        desgarro(g, 1.3, 0.3, OSCURO, 0, -0.85, 0.1, 'x');
      },
      // ESTABILIZADOR: el ala chica de cola. Misma familia que `ala`, media escala.
      estab(g) {
        PLATE(g, [[0, 0.7], [1.15, 0.2], [1.15, -0.2], [0, -0.55]], 0.09, MEDIO, -0.35, 0, 0);
        B(g, 0.13, 0.16, 0.9, OSCURO, -0.38, 0, 0.05);
        desgarro(g, 1.15, 0.2, OSCURO, -0.43, 0, 0.05, 'z');
      },
      // MORRO: el cono de la nariz con el pitot. Cae de punta y se lee al instante.
      morro(g) {
        CONE(g, 0.52, 1.9, MEDIO, 0, 0, -0.35, false, 12);
        CYL(g, 0.5, 0.52, 0.9, MEDIO, 0, 0, 0.95, 12);
        CYL(g, 0.08, 0.06, 0.34, OSCURO, 0, -0.02, -1.42, 8);  // pitot CORTO: con 0.7 la pieza entera se leia como una aguja
        CYL(g, 0.44, 0.44, 0.12, NEGRO, 0, 0, 1.42, 12);      // el corte, hueco
        desgarro(g, 1.0, 0.34, OSCURO, 0, 0, 1.4, 'x');
      },
      // COLA con TOBERA: el otro extremo. La boca oscura es la firma.
      cola(g) {
        CYL(g, 0.42, 0.52, 1.5, MEDIO, 0, 0, 0.05, 12);       // el tubo AFINA hacia el corte
        CYL(g, 0.72, 0.58, 0.5, OSCURO, 0, 0, 1.05, 14);      // anillo de escape ACAMPANADO
        CYL(g, 0.58, 0.58, 0.3, NEGRO, 0, 0, 1.2, 14);        // boca hundida y ancha
        CONE(g, 0.4, 0.5, '#191c15', 0, 0, 1.34, true, 10);
        desgarro(g, 1.0, 0.36, OSCURO, 0, 0, -0.66, 'x');
      },
      // TRAMO DE FUSELAJE: un anillo del tubo, roto en los dos extremos. El pedazo grande que
      // queda cuando algo se parte al medio.
      fuselaje(g) {
        CYL(g, 0.6, 0.6, 2.0, MEDIO, 0, 0, 0, 12);
        CYL(g, 0.48, 0.48, 2.06, NEGRO, 0, 0, 0, 12);          // hueco: se ve que es una cascara
        CYL(g, 0.64, 0.64, 0.12, OSCURO, 0, 0, -1.0, 12);
        CYL(g, 0.64, 0.64, 0.12, OSCURO, 0, 0, 1.0, 12);
        B(g, 0.16, 0.55, 2.0, OSCURO, 0, 0.45, 0);            // lomo, a lo largo: es un TRAMO, no una lata
        desgarro(g, 1.1, 0.4, OSCURO, 0, 0, 1.05, 'x');
      },
      // CABINA: la burbuja de vidrio con su marco. Es la unica pieza que NO es del color del
      // fuselaje — el vidrio se pinta aparte al dibujar (ver render/world.js).
      cabina(g) {
        DOME(g, 0.72, VIDRIO, 0, 0.1, 0, 1.0, 0.85, 1.5);
        B(g, 0.1, 0.5, 1.9, OSCURO, 0, 0.12, 0);              // arco central
        B(g, 1.5, 0.14, 0.14, OSCURO, 0, -0.35, -0.9);        // marco delantero
        B(g, 1.5, 0.14, 0.14, OSCURO, 0, -0.35, 0.9);
      },
      // TANQUE subalar: cilindro con las dos puntas conicas. Cae entero y rueda.
      tanque(g) {
        CYL(g, 0.34, 0.34, 1.7, CLARO, 0, 0, 0, 10);
        CONE(g, 0.34, 0.8, CLARO, 0, 0, -1.25, false, 10);
        CONE(g, 0.34, 0.6, CLARO, 0, 0, 1.15, true, 10);
        B(g, 0.5, 0.1, 0.4, OSCURO, 0, 0.36, -0.2);           // pilon cortado
      },
      // TREN: pata, amortiguador y rueda. Chica, pero es LA pieza que dice "esto era un avion".
      tren(g) {
        B(g, 0.16, 1.5, 0.16, MEDIO, 0, 0.3, 0);
        CYL(g, 0.12, 0.12, 0.5, OSCURO, 0, 0.95, 0, 8);
        const r = add(g, new THREE.TorusGeometry(0.42, 0.2, 6, 12), NEGRO, 0, -0.55, 0);
        r.rotation.y = Math.PI / 2;
        B(g, 0.5, 0.12, 0.5, OSCURO, 0, 1.15, 0);             // el muñon de la bahia
      },
      // PANEL de chapa: una plancha curva arrancada del revestimiento, con remaches y los cuatro
      // bordes desgarrados. Es el "pedazo cualquiera" — pero con forma de chapa, no de cubo.
      panel(g) {
        const p = PLATE(g, [[-0.9, 0.75], [0.85, 0.95], [0.95, -0.7], [-0.8, -0.9]], 0.08, MEDIO, 0, 0, 0);
        p.rotation.x = 0.22;
        for (let i = 0; i < 5; i++) B(g, 0.09, 0.06, 0.09, OSCURO, -0.7 + i * 0.35, 0.09, 0.55);
        desgarro(g, 1.7, 0.16, OSCURO, 0, 0, -0.85, 'x');
        desgarro(g, 1.5, 0.16, OSCURO, 0.9, 0, 0, 'z');
      },
    };

    // ---------- HORNEADO ----------
    function __bake() {
      const R = makeRenderer(), cam = makeCam();
      const outEl = document.getElementById('out');
      const nombres = Object.keys(PIEZAS);
      const sheet = document.createElement('canvas');
      sheet.width = FW * YAWS.length;
      sheet.height = FH * nombres.length;
      const x2 = sheet.getContext('2d');
      nombres.forEach((nombre, row) => {
        const sc = makeScene();
        const g = new THREE.Group();
        PIEZAS[nombre](g);
        // INCLINACION FIJA de 3/4: de perfil puro una plancha es una linea. Con la pieza un poco
        // volcada se le ve la cara Y el canto, que es lo que la hace leer como un volumen.
        const cont = new THREE.Group();
        cont.add(g); cont.rotation.x = 0.42; cont.rotation.z = 0.2;
        sc.add(cont);
        YAWS.forEach((ya, i) => {
          g.rotation.y = ya * Math.PI / 180;
          R.render(sc, cam);
          x2.drawImage(R.domElement, i * FW, row * FH);
        });
      });
      const h = document.createElement('h2');
      h.textContent = `partes — ${YAWS.length} giros x ${nombres.length} piezas, frames de ${FW}x${FH}`;
      const p = document.createElement('p');
      p.className = 'n';
      p.textContent = 'filas, en orden: ' + nombres.join(' · ');
      sheet.className = 'sheet';
      outEl.append(h, p, sheet);
      return { sheet: sheet.toDataURL('image/png'), piezas: nombres, fw: FW, fh: FH, yaws: YAWS.length };
    }
    window.__bake = __bake;
    __bake();
  </script>
</body>
</html>
