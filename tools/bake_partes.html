<!doctype html>
<html lang="es">
<!-- HERRAMIENTA: hornea la hoja de PARTES DEL DESPIECE desde modelos 3D low-poly.
     - Abrir en browser (con el server del repo) para VER/tunear las piezas.
     - `npx electron tools/bake_partes_run.js` la exporta a assets/world/explosions/partes.png

     POR QUE EXISTE: hasta ahora el escombro eran RECTANGULOS ROTADOS. A 8 px un rectangulo es
     un rectangulo — el avion se rompia en cuadrados. Las piezas salen del MISMO pipeline que los
     aviones (tools/bake_planes.html): las mismas primitivas, las mismas luces y el mismo
     atardecer, asi que un ala arrancada es el ala del avion y no un icono aparte.

     FORMATO: una FILA por pieza, una COLUMNA por giro (yaw). El juego le suma su propia rotacion
     en el plano (`o.spin`), asi que la hoja solo tiene que dar la silueta desde varios lados —
     entre las dos, la pieza tumba de verdad.

     SE HORNEA EN GRIS NEUTRO, no en el camo del avion: el color lo pone la RECETA
     (data/despiece.js) al dibujar. Asi la misma ala sirve para el A-4, para el Harrier y para
     cualquier avion que entre despues, y las piezas quedan disponibles para escombro que no es
     de avion sin re-hornear nada. -->

<head>
  <meta charset="utf-8">
  <title>bake_partes — RASANTE</title>
  <style>
    body { background: #10161b; color: #93a7ab; font-family: ui-monospace, Menlo, monospace; padding: 20px; }
    h2 { color: #e8a33d; font-size: 14px; margin: 18px 0 6px; }
    canvas.sheet { image-rendering: pixelated; border: 1px solid #2a363d; display: block; }
    p.n { font-size: 12px; margin: 4px 0 0; color: #6f7d82; }
  </style>
</head>

<body>
  <div id="out"></div>
  <script src="../src/vendor/three.global.js"></script>
  <script src="bake_common.js"></script>
  <script src="models/partes.js"></script>
  <script>
    'use strict';

    // TAMAÑO DEL FRAME. El escombro se dibuja como mucho a 26 px de MUNDO (el tope de
    // render/world.js), y el juego corre con buffer 2x -> 52 px de pantalla. Con 48 de fuente la
    // pieza nunca se estira: se dibuja a escala 1 o menos, que es donde el pixel art se ve limpio.
    const FW = 48, FH = 48;
    // GIROS por columna. Ocho alcanzan: la pieza ademas rota en el plano con `o.spin`, asi que
    // esto solo tiene que contestar "desde que lado la estoy viendo".
    const YAWS = [0, 45, 90, 135, 180, 225, 270, 315];

    // EL HORNO ES COMPARTIDO (tools/bake_common.js). MISMA LUZ que los aviones: si el escombro
    // se iluminara distinto, se leeria como de otro juego justo en el momento en que esta al lado
    // del avion que lo solto.
    //
    // CAMARA fija que encuadra una caja de ~3.2 unidades. Cada pieza se modela para ocupar eso,
    // asi que todas salen a la misma escala relativa: un ala tiene que verse mas grande que un
    // panel, y eso se consigue modelando, no escalando la camara por pieza.
    const CAM = { fov: 26, pos: [0, 1.5, 5.9], lookY: 0, near: 0.5, far: 100 };
    const makeRenderer = () => BAKE.renderer(THREE, FW, FH);
    const makeScene = () => BAKE.escena(THREE);
    const makeCam = () => BAKE.camara(THREE, FW, FH, CAM);

    // LOS MODELOS VIVEN EN tools/models/partes.js (PLAN_HORNEADO B0): un horneador es un
    // ENCUADRE (que camara, que poses, que grilla) y un modelo es una SILUETA.
    // EL ORDEN de `PIEZAS` es el de las FILAS de la hoja, y src/render/partes.js lo repite.
    const PIEZAS = BAKE.familia('partes');

    function __bake() {
      const R = makeRenderer(), cam = makeCam();
      const outEl = document.getElementById('out');
      const nombres = Object.keys(PIEZAS);
      const sheet = document.createElement('canvas');
      sheet.width = FW * YAWS.length;
      sheet.height = FH * nombres.length;
      const x2 = sheet.getContext('2d');
      nombres.forEach((nombre, row) => {
        const sc = makeScene();
        const g = new THREE.Group();
        PIEZAS[nombre](g);
        // INCLINACION FIJA de 3/4: de perfil puro una plancha es una linea. Con la pieza un poco
        // volcada se le ve la cara Y el canto, que es lo que la hace leer como un volumen.
        const cont = new THREE.Group();
        cont.add(g); cont.rotation.x = 0.42; cont.rotation.z = 0.2;
        sc.add(cont);
        YAWS.forEach((ya, i) => {
          g.rotation.y = ya * Math.PI / 180;
          R.render(sc, cam);
          x2.drawImage(R.domElement, i * FW, row * FH);
        });
      });
      const h = document.createElement('h2');
      h.textContent = `partes — ${YAWS.length} giros x ${nombres.length} piezas, frames de ${FW}x${FH}`;
      const p = document.createElement('p');
      p.className = 'n';
      p.textContent = 'filas, en orden: ' + nombres.join(' · ');
      sheet.className = 'sheet';
      outEl.append(h, p, sheet);
      return { sheet: sheet.toDataURL('image/png'), piezas: nombres, fw: FW, fh: FH, yaws: YAWS.length };
    }
    window.__bake = __bake;
    __bake();
  </script>
</body>
</html>
