<!doctype html>
<html lang="es">
<!-- HERRAMIENTA: hornea los sprite sheets de los ENEMIGOS (helicoptero, caza, vehiculos, barcaza,
     globo) desde modelos low-poly, igual que bake_planes.html hace con los aviones jugables.
     - Abrir en browser (con el server del repo) para VER/tunear los modelos.
     - `npx electron tools/bake_enemies_run.js` los exporta a assets/world/enemies/<nombre>.png

     DIFERENCIA CLAVE con los aviones: aca la camara mira DE FRENTE (los enemigos vienen HACIA el
     jugador), no desde atras. Los modelos se arman con la nariz hacia -z, como en bake_planes,
     y un grupo exterior los da vuelta (rotation.y = PI) para que encaren la camara. Las poses
     (yaw del helo, alabeo del caza, giro del plato) van en OTRO grupo mas afuera: encadenar dos
     rotaciones sobre el mismo objeto compone un euler que no es el que uno espera (la misma
     leccion que dejo la deriva del bake de aviones).

     Los helpers de volumen (CYL/CONE/DOME/PLATE/WING/FIN), la luz y la camara salen de
     tools/bake_common.js — EL HORNO, compartido por los cuatro horneadores desde PLAN_HORNEADO B0.
     Antes estaban copiados aca con la excusa de que "la duplicacion es preferible a compartir
     modulo entre tools"; con cuatro copias la regla "una luz, una camara, una paleta" no se podia
     ni verificar. -->

<head>
  <meta charset="utf-8">
  <title>bake_enemies — RASANTE</title>
  <style>
    body { background: #10161b; color: #93a7ab; font-family: ui-monospace, Menlo, monospace; padding: 20px; }
    h2 { color: #e8a33d; font-size: 14px; margin: 18px 0 6px; }
    canvas.sheet { image-rendering: pixelated; border: 1px solid #2a363d; display: block; }
  </style>
</head>

<body>
  <div id="out"></div>
  <script src="../src/vendor/three.global.js"></script>
  <script src="bake_common.js"></script>
  <script src="models/enemies.js"></script>
  <script src="models/restos.js"></script>
  <script src="models/buques.js"></script>
  <script src="models/harrier.js"></script>
  <script>
    'use strict';
    // EL HORNO ES COMPARTIDO (tools/bake_common.js): luz, camara, paleta y primitivas salen de
    // ahi para los cuatro horneadores — la regla 1 del plan ("una luz, una camara, una paleta")
    // dejo de ser una promesa repetida en cuatro archivos y pasa a ser un archivo.
    const CANOPY = BAKE.PAL.canopy;

    const makeRenderer = (w, h, clipY) => BAKE.renderer(THREE, w, h, clipY);
    /** LUZ DE LOS ENEMIGOS. El mismo rig de los aviones con MAS EXPOSICION (1.8 contra 1.5):
     *  a estos se los ve DE FRENTE, con el sol detras, asi que la cara que mira a la camara es la
     *  que esta en sombra. `rearFill` agrega el relleno frontal de las poses de cola, donde el
     *  cuerpo se come toda la luz que queda. */
    const makeScene = spec => BAKE.escena(THREE, spec && spec.rearFill
      ? { amb: 2.6, rearFill: true } : { amb: 1.8 });
    /** Camara FRONTAL, apenas por arriba: el mismo punto de vista con el que el juego ve venir a
     *  los enemigos. `dist` regula cuanto llena el frame el modelo.
     *
     *  `fov` es la DISTANCIA FOCAL, y es perilla por hoja como la exposicion: 24° es el teleobjetivo
     *  corto con el que se hornea todo lo del pasillo, y los BUQUES piden 8° a 90 unidades porque
     *  miden 130 metros — con 24° la popa se va tan atras que la proa sale un 30 % mas grande y el
     *  casco parece un cono. Sigue siendo el mismo rig: misma altura relativa, mismo lookAt. */
    const makeCam = (w, h, spec) => BAKE.camara(THREE, w, h,
      { fov: spec.fov || 24, pos: [0, 2.0, spec.dist], lookY: spec.lookY !== undefined ? spec.lookY : 0.2 });

    // ---------- primitivas de volumen (tools/bake_common.js) ----------
    // Estaban COPIADAS de bake_planes.html con la nota "son herramientas de build, la duplicacion
    // es preferible a compartir modulo entre tools". Con cuatro copias eso ya no se sostiene.
    const K = BAKE.kit(THREE);
    const { MAT, EMIT, add, addEmit, B, CYL, POST, CONE, DOME, PLATE, WING, FIN, WHEEL } = K;

    // LOS MODELOS VIVEN EN tools/models/enemies.js (PLAN_HORNEADO B0): un horneador es un
    // ENCUADRE (que camara, que poses, que grilla) y un modelo es una SILUETA.
    const { modelHelo, modelHercules, modelJet, modelRadar, modelAATruck, modelLcu, modelBalloon, modelAA, modelTent, modelDepot, modelBldg, modelFragata } = BAKE.familia('enemies');
    // LOS RESTOS (PLAN_HORNEADO B1): el estado ROTO de cada cosa, en tools/models/restos.js. Van
    // en ESTE horneador y no en uno propio porque son el MISMO encuadre — la camara que ve venir
    // al enemigo es la que despues lo ve tirado. Dos hornos serian dos luces.
    const R = BAKE.familia('restos');
    // LOS BUQUES (B2): las tres clases del juego, en tools/models/buques.js.
    const BQ = BAKE.familia('buques');
    // EL SEA HARRIER (B3): el perseguidor de LA COLA, en tools/models/harrier.js. Va aparte de los
    // demas enemigos porque es el unico modelo de autor del plan — el criterio de cierre no es una
    // medida, es que se distinga del jet generico sin leyenda.
    const HR = BAKE.familia('harrier');

    // ---------- catalogo de horneado ----------
    // frames: cada entrada es una POSE (funcion que devuelve el modelo + rotacion del grupo).
    // `wu` documenta cuantas unidades de MUNDO representa el ancho del frame (lo consume
    // render/enemies.js — si cambia aca, cambiarlo alla).
    const SHEETS = {
      // helo: 8 columnas de yaw (0=de frente → 90°=de perfil, cola a la DERECHA) x 2 fases de rotor
      helo: {
        fw: 64, fh: 48, dist: 15, lookY: 0.15,
        frames: (() => {
          const f = [];
          for (let ph = 0; ph < 2; ph++)
            for (let i = 0; i < 8; i++) f.push({ model: () => modelHelo(ph), yaw: i / 7 * Math.PI / 2 });
          return f;
        })(), cols: 8,
      },
      // LOS TRES JETS VAN AL DOBLE DE RESOLUCION que el resto (128x96 contra 64x48). No es
      // capricho: el Harrier es el UNICO enemigo que se te pone a z=6 —mas cerca de la camara que
      // tu propio avion, que vuela a 14— y ahi su sprite se amplia 5.4x mientras el tuyo se dibuja
      // a 0.85x. Medido: cada pixel suyo era 6.3 veces mas gordo que uno tuyo. El aspecto del
      // frame no cambia (64/48 == 128/96), asi que el encuadre es identico: la hoja solo gana
      // pixeles. Los enemigos que se quedan lejos no necesitan esto y siguen en 64x48.
      // LA CHANCHA: una sola pose (vuela recta y pareja: es un carguero, no bandea). Frame grande
      // porque se la ve MUY de cerca durante la cita — es el objeto mas grande del juego.
      chancha: {
        fw: 160, fh: 96, dist: 34, lookY: 0.6, baseYaw: 0,
        frames: [{ model: modelHercules }], cols: 1,
      },
      // caza: 5 columnas de alabeo -30..+30
      jet: {
        fw: 128, fh: 96, dist: 16, lookY: 0.2,
        frames: [-30, -15, 0, 15, 30].map(a => ({ model: modelJet, roll: a * Math.PI / 180 })), cols: 5,
      },
      // ============================ EL SEA HARRIER (B3) ============================
      // Las tres poses de LA COLA, y ahora con modelo propio: hasta B3 las horneaba `modelJet` —
      // el mismo caza generico del pasillo — y el perseguidor era un avion que no era de nadie.
      // Mismas medidas de frame y misma `dist` que las hojas que reemplazan: el Harrier no puede
      // cambiar de tamaño en pantalla, que seria un cambio de juego y esto es arte.
      //
      // DE FRENTE: 5 columnas de alabeo, la vista de cuando vuelve a encararte tras la recola.
      harrier: {
        fw: 128, fh: 96, dist: 16, lookY: 0.2,
        frames: [-30, -15, 0, 15, 30].map(a => ({ model: HR.harrier, roll: a * Math.PI / 180 })), cols: 5,
      },
      // DESDE ATRAS: mismos 5 alabeos pero la camara ve la cola (las dos toberas calientes, la
      // deriva, el borde de fuga del ala). Es la vista real de LA COLA — el Harrier vuela en tu
      // misma direccion y la camara esta detras de los dos.
      harrier_rear: {
        fw: 128, fh: 96, dist: 16, lookY: 0.2, baseYaw: 0, rearFill: true,
        frames: [-30, -15, 0, 15, 30].map(a => ({ model: HR.harrierRear, roll: a * Math.PI / 180 })), cols: 5,
      },
      // EN VIRAJE (la recola): 5 yaws de cola (0°) a frente (180°), con el alabeo de la virada.
      // La recola es la vuelta en U — el Harrier pasa de volar adelante tuyo a volver por atras.
      // ESTA HOJA EXISTIA DESDE ANTES (`jet_turn`) Y NADIE LA DIBUJABA: se horneaba en cada
      // horneada y ningun archivo del juego la nombraba. B3 la cablea (ver render/caza.js).
      harrier_turn: {
        fw: 128, fh: 96, dist: 18, lookY: 0.2, baseYaw: 0,
        frames: [0, 40, 90, 140, 180].map((deg, i) => ({
          model: HR.harrier,
          yaw: deg * Math.PI / 180,
          roll: [0, -25, -35, -25, 0][i] * Math.PI / 180,
        })), cols: 5,
      },
      // radar: 4 poses del plato (rota de a 45°)
      radar: {
        fw: 48, fh: 48, dist: 16, lookY: 1.6, quarter: 0.5,
        frames: [0, 1, 2, 3].map(i => ({ model: () => modelRadar(i * Math.PI / 4) })), cols: 4,
      },
      // camion AA: 3 poses de torreta (barre buscandote)
      aatruck: {
        fw: 56, fh: 48, dist: 16, lookY: 1.3, quarter: 0.5,
        frames: [-0.5, 0, 0.5].map(a => ({ model: () => modelAATruck(a) })), cols: 3,
      },
      // barcaza: 3 poses de ROLIDO (proa/rampa hacia la IZQUIERDA, que es donde esta la playa).
      // Un casco clavado en el agua parece una foto pegada; oscilando de a ±5° cabecea con la
      // marejada. El ciclo lo lleva el render (seno lento por barcaza).
      lcu: {
        fw: 72, fh: 48, dist: 17, lookY: 0.9, quarter: -0.55,
        frames: [-0.09, 0, 0.09].map(a => ({ model: modelLcu, roll: a })), cols: 3,
      },
      // globo: 3 poses de TAMBALEO (±7° de rolido) — colgado del cable, el viento lo hamaca
      balloon: {
        fw: 48, fh: 48, dist: 11, lookY: 0, quarter: 0.4,
        frames: [-0.12, 0, 0.12].map(a => ({ model: modelBalloon, roll: a })), cols: 3,
      },
      // nido AA: 2 poses de apunte de los caños
      aa: {
        fw: 48, fh: 48, dist: 14, lookY: 1.2, quarter: 0.45,
        frames: [-0.35, 0.35].map(a => ({ model: () => modelAA(a) })), cols: 2,
      },
      // carpa: frame unico, frente 3/4 con la entrada a la vista
      tent: {
        fw: 48, fh: 48, dist: 12, lookY: 0.6, quarter: 0.35,
        frames: [{ model: modelTent }], cols: 1,
      },
      // deposito: galpon abovedado con tambores
      depot: {
        fw: 64, fh: 48, dist: 15, lookY: 1.0, quarter: 0.4,
        frames: [{ model: modelDepot }], cols: 1,
      },
      // puesto: bloque a dos plantas (la ALTURA en juego varia: se escala por o.h al dibujar)
      bldg: {
        fw: 64, fh: 48, dist: 14, lookY: 1.4, quarter: 0.35,
        frames: [{ model: modelBldg }], cols: 1,
      },
      // fragata (casco del mastil de mar): PROA a camara, el mastil se dibuja por codigo encima
      fragata: {
        fw: 64, fh: 48, dist: 16, lookY: 1.0, quarter: 0.15,
        frames: [{ model: modelFragata }], cols: 1,
      },

      // ============================ LOS RESTOS (B1) ============================
      // Cada resto se hornea con LA MISMA camara que su version viva —misma dist, mismo lookY,
      // mismo 3/4— y a proposito: el resto tiene que caer exactamente donde estaba la cosa, con
      // la misma escala, o el cambio se lee como un salto. Lo unico que puede diferir es `lookY`
      // cuando el resto es mas bajo que el vivo (que es casi siempre: se derrumbo).
      resto_aa: {
        fw: 48, fh: 48, dist: 14, lookY: 0.8, quarter: 0.45,
        frames: [{ model: R.restoAA }], cols: 1,
      },
      resto_aatruck: {
        fw: 56, fh: 48, dist: 16, lookY: 0.9, quarter: 0.5,
        frames: [{ model: R.restoAATruck }], cols: 1,
      },
      resto_radar: {
        fw: 48, fh: 48, dist: 16, lookY: 1.0, quarter: 0.5,
        frames: [{ model: R.restoRadar }], cols: 1,
      },
      resto_depot: {
        fw: 64, fh: 48, dist: 15, lookY: 0.8, quarter: 0.4,
        frames: [{ model: R.restoDepot }], cols: 1,
      },
      // TRES ESTADOS DE DERRUMBE, y es el unico resto con mas de una pose: el edificio es lo que
      // escala por altura en el juego, asi que uno solo se repetiria en toda una base.
      resto_bldg: {
        fw: 64, fh: 48, dist: 14, lookY: 1.0, quarter: 0.35,
        frames: [0, 1, 2].map(n => ({ model: () => R.restoBldg(n) })), cols: 3,
      },
      resto_tent: {
        fw: 48, fh: 48, dist: 12, lookY: 0.25, quarter: 0.35,
        frames: [{ model: R.restoTent }], cols: 1,
      },
      // la pala que queda apuntando al cielo se salia por arriba (el autobox: margen 0). Se mira
      // mas alto y se toma un paso de distancia — el resto entra entero sin achicarse.
      resto_helo: {
        fw: 64, fh: 48, dist: 16.5, lookY: 1.15, quarter: 0.4,
        frames: [{ model: R.restoHelo }], cols: 1,
      },
      resto_jet: {
        fw: 64, fh: 48, dist: 16, lookY: 0.6, quarter: 0.35,
        frames: [{ model: R.restoJet }], cols: 1,
      },
      // DOS FINALES para la barcaza: escorada sobre una banda, o de proa hundida
      resto_lcu: {
        fw: 72, fh: 48, dist: 17, lookY: 0.5, quarter: -0.55,
        frames: [0, 1].map(n => ({ model: () => R.restoLcu(n) })), cols: 2,
      },
      resto_balloon: {
        fw: 48, fh: 48, dist: 11, lookY: -0.6, quarter: 0.4,
        frames: [{ model: R.restoBalloon }], cols: 1,
      },

      // ============================ LOS BUQUES (B2) ============================
      // TRES CLASES x TRES VISTAS: de costado (lo que ve el pasillo y EL PULSO), de proa (la
      // aproximacion sin teleport) y hundiendose (el premio del PULSO).
      //
      // LA CAMARA ES CASI ORTOGRAFICA, y es la unica familia del horno que lo pide: 8° de campo a
      // 90 unidades en vez de 24° a 15. No es otra camara —es el mismo rig, misma altura relativa,
      // mismo lookAt— es otra DISTANCIA FOCAL, la misma perilla por familia que la exposicion.
      // El motivo esta medido: un destructor mide 130 m y con teleobjetivo corto la popa se va a
      // 40 unidades de la proa, asi que la proa sale un 30 % mas grande y el buque parece un cono.
      // El casco 2D que estas hojas reemplazan es ortografico puro; si el horneado no lo fuera,
      // el respaldo y el sprite no empalmarian.
      //
      // `quarter: +PI/2` con `baseYaw: 0` deja la PROA A LA IZQUIERDA — igual que `drawBargeHull`,
      // que mete la roda hacia adentro desde su borde IZQUIERDO. Salio al reves en la primera
      // horneada y se ve enseguida en el logistico: la isla es de popa, asi que si aparece a la
      // derecha el buque esta navegando para el otro lado. Los dos dibujos tienen que empalmar —
      // el 2D sigue siendo el respaldo cuando la hoja no cargo.
      //
      // FRAME de 240x72 para el costado: es la mitad de la eslora maxima que alcanza el buque en
      // el climax (~456 px medidos), o sea que ahi se dibuja a 1,9x. Es la escala a la que se
      // dibuja el resto del pixel art del juego, asi que el buque no se ve de otra familia.
      ...(() => {
        const out = {};
        // `clipY: 0` — NADA BAJO LA FLOTACION. Es lo que hace que el borde de abajo del contenido
        // SEA la linea de agua, y por lo tanto que anclar el sprite por ahi lo plante exactamente
        // donde el casco 2D ponia su flotacion. Sin el recorte, la obra viva que asoma un pixel
        // corre al buque entero hacia arriba y queda flotando sobre el mar.
        // 2,2° a 90 unidades: el teleobjetivo mas largo del horno, y el encuadre sale de la cuenta,
        // no del ojo — a esa distancia el campo vertical mide 3,46 unidades y el buque 10 de eslora,
        // asi que entra con 15 px de aire a cada lado. `lookY 1.5` lo centra entre la flotacion y la
        // perilla del palo.
        const COSTADO = { fw: 240, fh: 72, dist: 90, fov: 2.42, lookY: 1.76, clipY: 0, baseYaw: 0, quarter: Math.PI / 2 };
        const PROA = { fw: 56, fh: 72, dist: 90, fov: 2.42, lookY: 1.64, clipY: 0, baseYaw: 0, quarter: 0 };
        for (const c of ['t42', 't21', 'log']) {
          // TRES POSES DE CABECEO. El buque se dibuja quieto en pantalla y sin esto se lee como
          // una foto pegada; el render las cicla con un seno lento. Son ±2,3°: a 400 px de eslora
          // eso son 16 px de sube y baja en las puntas, que es marejada, no tormenta.
          out['buque_' + c] = { ...COSTADO,
            frames: [-0.04, 0, 0.04].map(a => ({ model: () => BQ[c](), roll: a })), cols: 3 };
          out['proa_' + c] = { ...PROA,
            frames: [-0.05, 0, 0.05].map(a => ({ model: () => BQ[c](), roll: a })), cols: 3 };
          // LOS DOS FINALES: de proa (se va de nariz) y de popa. Dos y no uno porque cual toca es
          // lo unico que el jugador se lleva de como lo hundio.
          // el que se hunde pide MAS AIRE: la columna de humo sube por encima del palo y el casco
          // escorado saca la punta fuera del rectangulo que ocupaba navegando
          out['hundido_' + c] = { ...COSTADO, fov: 3.15, lookY: 2.0,
            frames: [1, 2].map(n => ({ model: () => BQ.hundido(c, n) })), cols: 2 };
        }
        return out;
      })(),
    };

    function __bake() {
      const outEl = document.getElementById('out');
      const result = {};
      // METADATOS de cada hoja, para que el runner pueda MEDIR las cajas sobre el alfa en vez de
      // que alguien las cuente a ojo. Un numero mal copiado deja al bicho flotando o enterrado y
      // no hay prueba que lo agarre — asi que se mide donde se hornea.
      window.__SHEETS_META = {};
      window.__SHEETS_DATA = {};
      for (const name in SHEETS) {
        const spec = SHEETS[name];
        const R = makeRenderer(spec.fw, spec.fh, spec.clipY);
        const cam = makeCam(spec.fw, spec.fh, spec);
        const cols = spec.cols, rows = Math.ceil(spec.frames.length / cols);
        const sheet = document.createElement('canvas');
        sheet.width = spec.fw * cols; sheet.height = spec.fh * rows;
        const x2 = sheet.getContext('2d');
        spec.frames.forEach((fr, i) => {
          const sc = makeScene(spec);
          // capas de rotacion, de adentro hacia afuera: modelo (nariz -z) → volteo hacia la
          // camara (PI) + 3/4 opcional → pose (yaw/alabeo). Grupos separados: ver cabecera.
          const flip = new THREE.Group(); flip.rotation.y = (spec.baseYaw !== undefined ? spec.baseYaw : Math.PI) + (spec.quarter || 0);
          flip.add(fr.model());
          // EL ALABEO VA ADENTRO DEL YAW, EN GRUPOS SEPARADOS, y esto costo un avion apuntando al
          // cielo. Estaban los dos en el MISMO grupo (`pose.rotation.y` y `pose.rotation.z`), que
          // es la trampa que esta cabecera ya advertia: con el avion girado 90°, el eje Z dejo de
          // ser su eje longitudinal, asi que rotar en Z no lo ALABEA — lo ENCABRITA. En la hoja de
          // viraje el frame del medio (yaw 90°, alabeo -35°) salia con la nariz para arriba.
          //
          // Nadie lo vio durante meses porque `jet_turn` era la unica hoja que pedia las dos
          // rotaciones juntas Y NINGUN ARCHIVO DEL JUEGO LA DIBUJABA (ver render/caza.js, B3). El
          // horno la horneaba mal en cada pasada y el error no llegaba a la pantalla.
          const pose = new THREE.Group();                 // el YAW: hacia donde apunta
          if (fr.yaw) pose.rotation.y = fr.yaw;
          const roll = new THREE.Group();                 // el ALABEO: sobre SU eje, ya girado
          if (fr.roll) roll.rotation.z = fr.roll;
          roll.add(flip); pose.add(roll); sc.add(pose);
          R.render(sc, cam);
          x2.drawImage(R.domElement, (i % cols) * spec.fw, Math.floor(i / cols) * spec.fh);
        });
        result[name] = sheet.toDataURL('image/png');
        window.__SHEETS_META[name] = { fw: spec.fw, fh: spec.fh, cols };
        window.__SHEETS_DATA[name] = result[name];
        if (outEl) {
          const h = document.createElement('h2');
          h.textContent = name + ' — ' + cols + 'x' + rows + ' frames de ' + spec.fw + 'x' + spec.fh;
          const big = document.createElement('canvas'); big.className = 'sheet';
          big.width = sheet.width * 4; big.height = sheet.height * 4;
          const bx = big.getContext('2d'); bx.imageSmoothingEnabled = false;
          bx.drawImage(sheet, 0, 0, big.width, big.height);
          outEl.appendChild(h); outEl.appendChild(big);
        }
      }
      return result;
    }
    window.__bake = __bake;

    /** LAS CAJAS, MEDIDAS SOBRE LA HOJA RECIEN HORNEADA (PLAN_HORNEADO B0, regla 3).
     *  `box` es el rectangulo de CONTENIDO adentro del frame, y de ahi sale donde se ancla cada
     *  bicho: al suelo los de tierra, al centro los del aire. Hasta B0 se contaban a ojo sobre el
     *  alfa, una por una — un numero mal copiado dejaba al enemigo flotando o enterrado, y no
     *  habia ninguna prueba que lo agarrara. El runner escribe lo que devuelve esto en
     *  assets/world/enemies/cajas.json, al lado de las hojas. */
    window.__cajas = () => BAKE.medirLote(Object.fromEntries(
      Object.keys(window.__SHEETS_META).map(k => [k, {
        data: window.__SHEETS_DATA[k], fw: window.__SHEETS_META[k].fw, fh: window.__SHEETS_META[k].fh,
      }])));

    if (!navigator.userAgent.includes('Electron')) __bake();
  </script>
</body>

</html>
