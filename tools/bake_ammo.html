<!doctype html>
<html lang="es">
<!-- HERRAMIENTA: hornea la hoja de MUNICION desde modelos 3D low-poly, igual que bake_planes.html.
     - Abrir en el browser (con el server del repo) para VER/tunear los modelos.
     - `npx electron tools/bake_ammo_run.js` la exporta a assets/ammo/municion.png

     FORMATO: 6 columnas x 2 filas de 16x16.
       filas    0 = BOMBA (la ristra del PULSO y de la PASADA) · 1 = MISIL (el del pasillo)
       columnas ANGULO DE VISTA: 0 = de cola pura (se aleja de frente) … 5 = casi de costado.

     POR QUE ESA GRILLA Y NO LA DE LOS AVIONES. Un avion se hornea por alabeo x cabeceo porque
     ROLA y se lo ve siempre desde atras. Un proyectil no rola: lo unico que cambia es el angulo
     entre su eje y la camara — sale de cola, y a medida que cae o se desvia se lo empieza a ver
     de costado. Esa es la grilla que de verdad varia en el juego.

     POR QUE 16 px Y NO 84. La municion se dibuja entre 4 y 16 px en pantalla. Horneada a 84 habria
     que reducirla 5x y lo que llega es puré: en pixel art el asset se hornea CERCA del tamaño al
     que se dibuja. A 16 entra la silueta —cuerpo, ojiva y aletas— que es todo lo que se lee.

     Y UNA SEGUNDA HOJA, assets/ammo/aim9.png: EL SIDEWINDER de los Harrier (30/9/2026). Va aparte
     porque su grilla es otra: 10 vistas de 0° (de cola) a 180° (DE NARIZ), en frames de 32. La hoja
     de arriba solo tiene vistas de cola porque su municion siempre se aleja; al Sidewinder se lo ve
     venir de frente (el de un caza del pasillo) y alejarse hacia tu avion (el de LA COLA), y se lo
     dibuja mas grande — el de atras nace a 10 unidades de la camara. -->
<head>
  <meta charset="utf-8">
  <title>bake_ammo — RASANTE</title>
  <style>
    body { background: #10161b; color: #93a7ab; font-family: ui-monospace, Menlo, monospace; padding: 20px; }
    h2 { color: #e8a33d; font-size: 14px; margin: 18px 0 6px; }
    canvas.sheet { image-rendering: pixelated; border: 1px solid #2a363d; display: block; }
  </style>
</head>
<body>
  <div id="out"></div>
  <script src="../src/vendor/three.global.js"></script>
  <script src="bake_common.js"></script>
  <script src="models/ammo.js"></script>
  <script>
    'use strict';
    const FW = 16, FH = 16;
    // ANGULO DE VISTA por columna, en grados: cuanto se inclina el eje del proyectil respecto de
    // la camara. 0 es de cola pura (lo que ves cuando se aleja derecho).
    const VISTAS = [0, 15, 30, 45, 62, 80];
    const FILAS = ['bomba', 'misil'];
    // EL SIDEWINDER: su propia grilla (ver el encabezado). 0 = de cola, 180 = de nariz. El render
    // (src/render/aim9.js) repite estas vistas — si se cambian aca, se cambian alla.
    const AIM9_FW = 32, AIM9_VISTAS = [0, 20, 40, 60, 80, 100, 120, 140, 160, 180];
    // MAS LEJOS que la camara de la municion chica: de costado (90°) el misil queda PARADO en el
    // frame y tiene que entrar entero — 2,9 de largo contra los ~2,95 que ve la camara de arriba.
    const AIM9_CAM = { fov: 26, pos: [0, 0.3, 7.4], lookY: 0, near: 0.5, far: 60 };

    // EL HORNO ES COMPARTIDO (tools/bake_common.js). MISMA LUZ QUE LOS AVIONES: si la municion
    // se iluminara distinta se leeria como pegada de otro juego. Atardecer del Atlantico —
    // calida de arriba a la izquierda, contraluz rojizo.
    //
    // La camara mira por el eje Z. El proyectil vive a lo largo de Z con la NARIZ hacia -Z, o sea
    // alejandose: en la columna 0 se le ve la cola, que es como sale de abajo del avion.
    const CAM = { fov: 26, pos: [0, 0.55, 6.4], lookY: 0, near: 0.5, far: 60 };
    const makeRenderer = () => BAKE.renderer(THREE, FW, FH);
    const makeScene = () => BAKE.escena(THREE);
    const makeCam = () => BAKE.camara(THREE, FW, FH, CAM);

    // LOS MODELOS VIVEN EN tools/models/ammo.js (PLAN_HORNEADO B0): un horneador es un
    // ENCUADRE (que camara, que poses, que grilla) y un modelo es una SILUETA.
    const MODELS = BAKE.familia('ammo');

    function __bake() {
      const R = makeRenderer(), cam = makeCam();
      const sheet = document.createElement('canvas');
      sheet.width = FW * VISTAS.length; sheet.height = FH * FILAS.length;
      const x2 = sheet.getContext('2d');
      FILAS.forEach((key, row) => {
        const sc = makeScene();
        const model = MODELS[key]();
        sc.add(model);
        VISTAS.forEach((v, col) => {
          // se inclina el MODELO y no la camara: asi la luz queda igual en toda la fila y el
          // proyectil no cambia de tono al girar (que se leeria como que cambio de material).
          model.rotation.x = v * Math.PI / 180;
          R.render(sc, cam);
          x2.drawImage(R.domElement, col * FW, row * FH);
        });
      });
      const out = sheet.toDataURL('image/png');
      const outEl = document.getElementById('out');
      if (outEl) {
        const h = document.createElement('h2');
        h.textContent = `municion — ${VISTAS.length}x${FILAS.length} frames de ${FW}x${FH} · filas: ${FILAS.join(' / ')} · vistas: ${VISTAS.join('° ')}°`;
        const big = document.createElement('canvas'); big.className = 'sheet';
        big.width = sheet.width * 8; big.height = sheet.height * 8;
        const bx = big.getContext('2d'); bx.imageSmoothingEnabled = false;
        bx.drawImage(sheet, 0, 0, big.width, big.height);
        outEl.appendChild(h); outEl.appendChild(big);
      }
      return { municion: out, aim9: bakeAim9(outEl) };
    }

    /** La hoja del Sidewinder: una fila, AIM9_VISTAS columnas. Mismo horno y misma luz. */
    function bakeAim9(outEl) {
      const R = BAKE.renderer(THREE, AIM9_FW, AIM9_FW), cam = BAKE.camara(THREE, AIM9_FW, AIM9_FW, AIM9_CAM);
      const sheet = document.createElement('canvas');
      sheet.width = AIM9_FW * AIM9_VISTAS.length; sheet.height = AIM9_FW;
      const x2 = sheet.getContext('2d');
      const sc = makeScene(), model = MODELS.aim9();
      sc.add(model);
      AIM9_VISTAS.forEach((v, col) => {
        // igual que arriba: se inclina el MODELO. En 90° la nariz queda ARRIBA en el frame — el
        // render rota el sprite para que ese "arriba" apunte hacia donde va el misil.
        model.rotation.x = v * Math.PI / 180;
        R.render(sc, cam);
        x2.drawImage(R.domElement, col * AIM9_FW, 0);
      });
      if (outEl) {
        const h = document.createElement('h2');
        h.textContent = `aim9 — ${AIM9_VISTAS.length} vistas de ${AIM9_FW}x${AIM9_FW} · de cola (0°) a de nariz (180°)`;
        const big = document.createElement('canvas'); big.className = 'sheet';
        big.width = sheet.width * 4; big.height = sheet.height * 4;
        const bx = big.getContext('2d'); bx.imageSmoothingEnabled = false;
        bx.drawImage(sheet, 0, 0, big.width, big.height);
        outEl.appendChild(h); outEl.appendChild(big);
      }
      return sheet.toDataURL('image/png');
    }
    window.__bake = __bake;
    if (!navigator.userAgent.includes('Electron')) __bake();
  </script>
</body>
</html>
