<!doctype html>
<html lang="es">
<!-- HERRAMIENTA: hornea los sprite sheets de los aviones desde modelos 3D low-poly.
     - Abrir en browser (con el server del repo) para VER/tunear los modelos.
     - `npx electron tools/bake_planes_run.js` los exporta a assets/img/plane_<key>_sheet.png
     Formato de sheet: 9 frames horizontales de 56x32, alabeo -60..+60 en pasos de 15
     (frame 4 = nivelado). Si el arte final lo dibuja un humano, debe respetar este layout. -->

<head>
  <meta charset="utf-8">
  <title>bake_planes — RASANTE</title>
  <style>
    body { background: #10161b; color: #93a7ab; font-family: ui-monospace, Menlo, monospace; padding: 20px; }
    h2 { color: #e8a33d; font-size: 14px; margin: 18px 0 6px; }
    canvas.sheet { image-rendering: pixelated; border: 1px solid #2a363d; display: block; }
  </style>
</head>

<body>
  <div id="out"></div>
  <script src="../src/vendor/three.global.js"></script>
  <script>
    'use strict';
    // RESOLUCION: 56x32 -> 84x48 (x1.5) al subir la grilla del juego a 480x270. Mismo aspecto
    // (1.75), asi que el encuadre de la camara no cambia. Con 84 px de fuente y el buffer 2x
    // del juego, el sprite se dibuja a 2x EXACTO: pixel art nitido en vez de un estirado 3x.
    const FW = 84, FH = 48;                       // tamaño de cada frame
    const ANGLES = [-60, -45, -30, -15, 0, 15, 30, 45, 60];   // alabeo por columna (indice 4 = nivelado)
    const PITCHES = [14, 0, -14];                 // cabeceo por FILA: trepando / nivelado / picando

    // paleta compartida con el juego (atardecer)
    const CANOPY = '#8fd0e0', ACCENT = '#e8a33d', EXHAUST = '#2b2f28';

    function makeRenderer() {
      const r = new THREE.WebGLRenderer({ antialias: false, alpha: true });
      r.setSize(FW, FH, false);
      return r;
    }
    function makeScene() {
      const sc = new THREE.Scene();
      sc.add(new THREE.AmbientLight(0xaebccc, 1.5));
      const dl = new THREE.DirectionalLight(0xe8c07a, 1.6); dl.position.set(-3, 5, 4); sc.add(dl);
      const rim = new THREE.DirectionalLight(0xb06a35, 0.5); rim.position.set(2, 1, -4); sc.add(rim);
      return sc;
    }
    function makeCam() {
      const cam = new THREE.PerspectiveCamera(24, FW / FH, 1, 100);
      cam.position.set(0, 1.1, 12.5); cam.lookAt(0, 0.3, 0);   // vista trasera, apenas por encima
      return cam;
    }
    const B = (g, w, h, d, c, x, y, z, ry) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: c }));
      m.position.set(x, y, z); if (ry) m.rotation.y = ry;
      g.add(m); return m;
    };

    // ---------- modelos (vista trasera: nariz hacia -z, cola hacia +z/camara) ----------
    // A-4 SKYHAWK (camo selva) y A-4Q (esquema naval): misma celula, distinta pintura
    function modelA4(camoA, camoB, camoDetail) {
      const g = new THREE.Group();
      B(g, 0.78, 0.78, 5.0, camoA, 0, 0, 0);                    // fuselaje
      B(g, 0.5, 0.5, 1.0, EXHAUST, 0, 0, 2.6);                  // tobera
      // ALA en flecha: cinco bandas que se angostan hacia adelante. Antes eran DOS cajas y el
      // borde de ataque quedaba como un escalon cuadrado (efecto 'avion de carton').
      B(g, 5.20, 0.14, 0.55, camoB, 0, -0.16, 1.15);            // ala: borde de fuga (max envergadura)
      B(g, 4.60, 0.14, 0.55, camoB, 0, -0.155, 0.63);
      B(g, 3.90, 0.13, 0.55, camoB, 0, -0.15, 0.11);
      B(g, 3.10, 0.13, 0.55, camoDetail, 0, -0.145, -0.41);
      B(g, 2.20, 0.12, 0.55, camoDetail, 0, -0.14, -0.93);      // ala: borde de ataque (angosto)
      B(g, 1.7, 0.16, 0.9, camoDetail, -1.25, -0.10, 0.75);     // parche camo
      B(g, 1.3, 0.16, 0.8, camoDetail, 1.45, -0.11, 0.95);      // parche camo
      B(g, 2.2, 0.10, 0.8, camoB, 0, 0.5, 2.15);                // estab. alto (A-4)
      B(g, 0.12, 1.3, 1.0, camoA, 0, 0.85, 2.15);               // deriva
      B(g, 0.12, 0.4, 0.6, ACCENT, 0, 1.4, 2.2);                // punta acento
      B(g, 0.5, 0.38, 1.0, CANOPY, 0, 0.48, -1.35);             // cabina
      B(g, 0.56, 0.16, 1.2, camoA, 0, 0.26, -1.3);
      B(g, 0.32, 0.32, 1.7, camoDetail, -1.6, -0.4, 0.3);       // tanque
      B(g, 0.32, 0.32, 1.7, camoDetail, 1.6, -0.4, 0.3);        // tanque
      // --- detalle que recien se ve a 84x48 ---
      B(g, 0.44, 0.52, 1.4, camoB, -0.66, 0.12, -0.35);        // TOMA DE AIRE izq
      B(g, 0.44, 0.52, 1.4, camoB, 0.66, 0.12, -0.35);         // TOMA DE AIRE der
      B(g, 0.26, 0.34, 0.8, '#20261f', -0.74, 0.12, -0.95);    // boca oscura
      B(g, 0.26, 0.34, 0.8, '#20261f', 0.74, 0.12, -0.95);
      B(g, 0.34, 0.30, 0.7, '#2a2f26', 0, 0, 3.0);             // anillo de escape
      B(g, 0.45, 0.17, 0.55, '#7f8b93', -2.42, -0.16, 1.15);   // punta de ala
      B(g, 0.45, 0.17, 0.55, '#7f8b93', 2.42, -0.16, 1.15);
      return g;
    }
    // IAI DAGGER (Mirage V, camo desierto): DELTA grande escalonado, sin estabilizador
    function modelDagger() {
      const g = new THREE.Group();
      const tan = '#8a7350', brown = '#6b5236', sand = '#9c8a66';
      B(g, 0.66, 0.7, 5.4, tan, 0, 0.05, 0);                    // fuselaje esbelto
      B(g, 0.46, 0.46, 1.0, EXHAUST, 0, 0.02, 2.8);             // tobera
      B(g, 6.0, 0.13, 1.5, tan, 0, -0.14, 1.15);                // delta: banda trasera (ancha)
      B(g, 4.4, 0.12, 1.2, brown, 0, -0.12, 0.05);              // delta: banda media
      B(g, 2.6, 0.11, 1.1, sand, 0, -0.10, -1.05);              // delta: banda frontal (angosta)
      B(g, 1.6, 0.15, 0.9, brown, -1.7, -0.10, 1.0);            // parche
      B(g, 1.2, 0.15, 0.8, sand, 1.8, -0.11, 1.1);              // parche
      B(g, 0.12, 1.55, 1.15, tan, 0, 0.9, 2.15);                // deriva alta en flecha
      B(g, 0.12, 0.45, 0.6, ACCENT, 0, 1.55, 2.25);             // punta acento
      B(g, 0.46, 0.34, 0.9, CANOPY, 0, 0.5, -1.7);              // cabina
      B(g, 0.5, 0.15, 1.1, tan, 0, 0.3, -1.65);
      B(g, 0.42, 0.5, 1.5, brown, -0.6, 0.14, -0.45);          // TOMA DE AIRE izq
      B(g, 0.42, 0.5, 1.5, brown, 0.6, 0.14, -0.45);           // TOMA DE AIRE der
      B(g, 0.26, 0.34, 0.9, '#241f18', -0.7, 0.14, -1.1);      // boca oscura
      B(g, 0.26, 0.34, 0.9, '#241f18', 0.7, 0.14, -1.1);
      B(g, 0.34, 0.30, 0.8, '#2a2620', 0, 0.02, 3.15);         // anillo de escape
      B(g, 0.5, 0.16, 0.9, sand, -2.8, -0.13, 1.25);           // punta de ala
      B(g, 0.5, 0.16, 0.9, sand, 2.8, -0.13, 1.25);
      return g;
    }
    // SUPER ETENDARD (gris azulado naval): ala media en flecha, estab. sobre el fuselaje
    function modelSuperE() {
      const g = new THREE.Group();
      const blu = '#5a6a78', blu2 = '#495866', lite = '#75858f';
      B(g, 0.76, 0.72, 5.0, blu, 0, 0, 0);
      B(g, 0.5, 0.5, 1.0, EXHAUST, 0, 0, 2.6);
      B(g, 5.0, 0.13, 1.5, blu2, 0, 0.02, 0.5);                 // ala MEDIA en flecha
      B(g, 3.2, 0.12, 1.0, lite, 0, 0.03, -0.5);
      B(g, 1.5, 0.15, 0.9, lite, -1.5, 0.06, 0.4);              // franja clara
      B(g, 2.3, 0.10, 0.8, blu2, 0, 0.55, 2.1);                 // estab.
      B(g, 0.12, 1.35, 1.0, blu, 0, 0.85, 2.2);                 // deriva
      B(g, 0.12, 0.4, 0.55, ACCENT, 0, 1.42, 2.28);
      B(g, 0.5, 0.38, 1.1, CANOPY, 0, 0.46, -1.45);             // cabina
      B(g, 0.56, 0.16, 1.3, blu, 0, 0.24, -1.4);
      B(g, 0.3, 0.3, 1.6, blu2, -1.55, -0.28, 0.35);            // tanque/misil
      B(g, 0.3, 0.3, 1.6, blu2, 1.55, -0.28, 0.35);
      B(g, 0.44, 0.5, 1.4, lite, -0.64, 0.14, -0.4);           // TOMA DE AIRE izq
      B(g, 0.44, 0.5, 1.4, lite, 0.64, 0.14, -0.4);            // TOMA DE AIRE der
      B(g, 0.26, 0.34, 0.8, '#1e252b', -0.72, 0.14, -1.0);     // boca oscura
      B(g, 0.26, 0.34, 0.8, '#1e252b', 0.72, 0.14, -1.0);
      B(g, 0.34, 0.30, 0.7, '#232a30', 0, 0, 3.0);             // anillo de escape
      B(g, 0.45, 0.16, 0.9, '#8b98a3', -2.3, 0.03, 0.55);      // punta de ala
      B(g, 0.45, 0.16, 0.9, '#8b98a3', 2.3, 0.03, 0.55);
      return g;
    }
    // PAMPA IA-63 (entrenador blanco/naranja): ala ALTA recta, cola convencional
    function modelPampa() {
      const g = new THREE.Group();
      const wht = '#d8dde2', org = '#e07030', gry = '#9aa4ad';
      B(g, 0.72, 0.72, 4.6, wht, 0, 0, 0);
      B(g, 0.44, 0.44, 0.9, EXHAUST, 0, 0, 2.35);
      B(g, 5.2, 0.13, 1.35, wht, 0, 0.28, 0.3);                 // ala ALTA recta
      B(g, 1.1, 0.15, 1.3, org, -2.15, 0.3, 0.3);               // puntas naranjas
      B(g, 1.1, 0.15, 1.3, org, 2.15, 0.3, 0.3);
      B(g, 2.3, 0.10, 0.8, wht, 0, 0.35, 2.0);                  // estab.
      B(g, 0.6, 0.12, 0.8, org, -1.05, 0.35, 2.0);              // puntas estab.
      B(g, 0.6, 0.12, 0.8, org, 1.05, 0.35, 2.0);
      B(g, 0.12, 1.3, 0.95, wht, 0, 0.8, 2.0);                  // deriva
      B(g, 0.12, 0.5, 0.9, org, 0, 1.35, 2.0);                  // banda naranja deriva
      B(g, 0.48, 0.4, 1.35, CANOPY, 0, 0.46, -1.15);            // cabina larga (biplaza)
      B(g, 0.54, 0.16, 1.5, gry, 0, 0.24, -1.1);
      B(g, 0.4, 0.46, 1.2, gry, -0.6, 0.2, -0.25);             // TOMA DE AIRE izq
      B(g, 0.4, 0.46, 1.2, gry, 0.6, 0.2, -0.25);              // TOMA DE AIRE der
      B(g, 0.24, 0.3, 0.7, '#2b3036', -0.68, 0.2, -0.8);       // boca oscura
      B(g, 0.24, 0.3, 0.7, '#2b3036', 0.68, 0.2, -0.8);
      B(g, 0.3, 0.28, 0.6, '#2b3036', 0, 0, 2.7);              // anillo de escape
      B(g, 0.9, 0.14, 0.5, org, 0, 0.29, -1.9);                // franja naranja del morro
      return g;
    }

    // MIRAGE IIIEA (camo verde/marron argentino): delta puro como el Dagger — es la misma
    // familia — pero con la pintura de la FAA y morro de radar mas largo.
    function modelMirage() {
      const g = new THREE.Group();
      const grn = '#5c6b45', dgrn = '#43503a', tan = '#8d7f5c', gry = '#6e7566';
      B(g, 0.70, 0.72, 5.6, grn, 0, 0.04, 0);                   // fuselaje
      B(g, 0.52, 0.5, 0.9, EXHAUST, 0, 0.02, 2.9);              // tobera
      B(g, 0.34, 0.30, 0.8, '#2a2f26', 0, 0.02, 3.25);          // anillo de escape
      B(g, 6.1, 0.13, 1.5, grn, 0, -0.14, 1.2);                 // delta: banda trasera
      B(g, 4.5, 0.12, 1.2, dgrn, 0, -0.12, 0.1);                // delta: banda media
      B(g, 2.7, 0.11, 1.1, tan, 0, -0.10, -1.0);                // delta: banda frontal
      B(g, 1.7, 0.15, 0.9, dgrn, -1.75, -0.10, 1.05);           // parche camo
      B(g, 1.3, 0.15, 0.8, tan, 1.85, -0.11, 1.15);             // parche camo
      B(g, 0.5, 0.16, 0.9, '#7f8b93', -2.85, -0.10, 1.3);       // punta de ala clara
      B(g, 0.5, 0.16, 0.9, '#7f8b93', 2.85, -0.10, 1.3);
      B(g, 0.42, 0.5, 1.5, gry, -0.62, 0.12, -0.5);             // TOMA DE AIRE izq
      B(g, 0.42, 0.5, 1.5, gry, 0.62, 0.12, -0.5);              // TOMA DE AIRE der
      B(g, 0.26, 0.34, 0.9, '#20261f', -0.72, 0.12, -1.15);     // boca oscura
      B(g, 0.26, 0.34, 0.9, '#20261f', 0.72, 0.12, -1.15);
      B(g, 0.12, 1.6, 1.15, grn, 0, 0.92, 2.2);                 // deriva alta
      B(g, 0.12, 0.45, 0.6, ACCENT, 0, 1.6, 2.3);               // punta acento
      B(g, 0.46, 0.34, 0.95, CANOPY, 0, 0.52, -1.75);           // cabina
      B(g, 0.5, 0.15, 1.2, grn, 0, 0.32, -1.7);
      B(g, 0.34, 0.34, 1.0, tan, 0, 0.0, -2.75);                // morro / radomo
      B(g, 0.3, 0.3, 1.6, dgrn, -1.55, -0.34, 0.5);             // tanque
      B(g, 0.3, 0.3, 1.6, dgrn, 1.55, -0.34, 0.5);              // tanque
      return g;
    }

    const MODELS = {
      sky: () => modelA4('#5d6b4c', '#66744f', '#6b5a3f'),
      dagger: modelDagger,
      supere: modelSuperE,
      a4q: () => modelA4('#6a7480', '#75808c', '#59636e'),
      pampa: modelPampa,
      mirage: modelMirage,
    };

    // hornea todos los sheets; devuelve { key: dataURL_png }
    function __bake() {
      const R = makeRenderer(), cam = makeCam();
      const outEl = document.getElementById('out');
      const result = {};
      for (const key in MODELS) {
        const sc = makeScene();
        const model = MODELS[key]();
        sc.add(model);
        const sheet = document.createElement('canvas');
        sheet.width = FW * ANGLES.length; sheet.height = FH * PITCHES.length;
        const x2 = sheet.getContext('2d');
        PITCHES.forEach((pa, row) => {
          model.rotation.x = pa * Math.PI / 180;
          ANGLES.forEach((a, i) => {
            model.rotation.z = a * Math.PI / 180;
            R.render(sc, cam);
            x2.drawImage(R.domElement, i * FW, row * FH);
          });
        });
        result[key] = sheet.toDataURL('image/png');
        if (outEl) {   // vista previa (modo browser)
          const h = document.createElement('h2'); h.textContent = key + ' — ' + ANGLES.length + 'x' + PITCHES.length + ' frames de ' + FW + 'x' + FH + ' (filas: trepa/nivel/pica)';
          const big = document.createElement('canvas'); big.className = 'sheet';
          big.width = sheet.width * 4; big.height = sheet.height * 4;
          const bx = big.getContext('2d'); bx.imageSmoothingEnabled = false;
          bx.drawImage(sheet, 0, 0, big.width, big.height);
          outEl.appendChild(h); outEl.appendChild(big);
        }
      }
      return result;
    }
    window.__bake = __bake;
    if (!navigator.userAgent.includes('Electron')) __bake();   // en browser: hornear y mostrar
  </script>
</body>

</html>
