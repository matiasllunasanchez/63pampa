<!doctype html>
<html lang="es">
<!-- HERRAMIENTA: hornea los sprite sheets de los aviones desde modelos 3D low-poly.
     - Abrir en browser (con el server del repo) para VER/tunear los modelos.
     - `npx electron tools/bake_planes_run.js` los exporta a assets/planes/<slug>/sheet.png
     Formato de sheet: 9 columnas (alabeo -60..+60 cada 15, la 4 = nivelado) x 3 filas
     (cabeceo: trepa/nivel/pica), frames de 84x84. Si el arte final lo dibuja un humano,
     debe respetar este layout. -->

<head>
  <meta charset="utf-8">
  <title>bake_planes — RASANTE</title>
  <style>
    body { background: #10161b; color: #93a7ab; font-family: ui-monospace, Menlo, monospace; padding: 20px; }
    h2 { color: #e8a33d; font-size: 14px; margin: 18px 0 6px; }
    canvas.sheet { image-rendering: pixelated; border: 1px solid #2a363d; display: block; }
  </style>
</head>

<body>
  <div id="out"></div>
  <script src="../src/vendor/three.global.js"></script>
  <script src="bake_common.js"></script>
  <script src="models/planes.js"></script>
  <script>
    'use strict';
    // RESOLUCION: 56x32 -> 84x48 (x1.5) al subir la grilla del juego a 480x270. Mismo aspecto
    // (1.75), asi que el encuadre de la camara no cambia. Con 84 px de fuente y el buffer 2x
    // del juego, el sprite se dibuja a 2x EXACTO: pixel art nitido en vez de un estirado 3x.
    // ALTO DEL FRAME: al alabear 60° la envergadura se PARA y pasa a ocupar en vertical casi lo
    // mismo que ocupaba a lo ancho. Con 48 px las puntas de ala quedaban CORTADAS en las columnas
    // extremas. El frame pasa a ser cuadrado: el avion no cambia de tamaño (ver makeCam), solo
    // gana aire arriba y abajo para poder girar entero.
    const FW = 84, FH = 84;                       // tamaño de cada frame
    const ANGLES = [-60, -45, -30, -15, 0, 15, 30, 45, 60];   // alabeo por columna (indice 4 = nivelado)
    const PITCHES = [14, 0, -14];                 // cabeceo por FILA: trepando / nivelado / picando
    // HOJA 2 (sheet2.png): cabeceos EMPINADOS para las PIRUETAS (pop-up, split-s, yo-yos). El
    // ±14 de la hoja base es el cabeceo de crucero; una trepada de combate necesita VERSE
    // brusca. Va en hoja aparte: el build web la descarta (limite de 16 MB) y el render cae a
    // las filas normales — la pirueta se sigue jugando igual, solo pierde pose.
    const STEEP = [32, -32];

    // ============================ HOJA 3 (sheet3.png) — LA DEL PODER RASANTE ============================
    // MISMA GRILLA que la hoja base (9 alabeos x 3 cabeceos) para que el render no necesite ni una
    // linea de logica nueva: `colPose` y `rowPose` de render/plane.js sirven igual, y si la hoja no
    // cargo se cae a la de siempre sin pensar. Lo unico que cambia es DESDE DONDE se mira.
    //
    // POR QUE EXISTE. Durante el poder la camara se corre `lat` = 10 unidades a la derecha mientras
    // el avion sigue clavado a z = 14, o sea que lo mira desde 35,5° AL COSTADO — y el sprite esta
    // horneado de cola pura. El avion queda de espaldas a una camara que lo ve de tres cuartos, y
    // eso es lo que se lee como "plano". No es una impresion: son 35,54° que faltan, medidos
    // (atan(10/14)), y es la divergencia 16 de SPEC_PODER_RASANTE escrita con numeros.
    //
    // LA ELEVACION ES OTRA HISTORIA, Y ES UNA MENTIRA DELIBERADA. La camara del poder esta 3.0
    // unidades ARRIBA del avion (`lift`), o sea +9,9° — casi exactamente los +10,2° con los que ya
    // se hornea la hoja base. Por geometria no habria que tocarla. Pero desde arriba no se ve la
    // PANZA, y la panza celeste es la mitad de la silueta de un A-4 contra el cielo; la referencia
    // que eligio el autor (Rasant) mira la nave desde abajo y de eso vive su encuadre. Asi que esta
    // hoja se hornea desde ABAJO y la camara del juego baja lo que el motor le permite para que el
    // mundo no la contradiga (ver RAS_CAMS en data/tuning.js).
    // Es el mismo precedente que la Chancha, al reves: alla la geometria pedia 31° y se horneo a 12
    // porque 31 se leia como una picada; aca la geometria pide +10 y se hornea en -10 porque +10 se
    // lee como una calcomania. EL ANGULO QUE MANDA ES EL QUE SE LEE, y las dos veces se eligio
    // mirando un barrido, no razonando.
    const FW3 = 168, FH3 = 168;          // el DOBLE de la hoja base: durante el poder el sprite se
                                         // dibuja a 142,8 px de mundo, o sea 3,4 px de pantalla por
                                         // pixel horneado. Con 168 vuelve a 1,7 — la misma nitidez
                                         // que tiene el avion en el pasillo, al doble de tamaño.
    const RAS_YAW = 35.5;                // grados de camara hacia +x (se ve el flanco DERECHO, que
                                         // es el lado desde el que mira: `lat` positivo)
    const RAS_ELEV = -10;                // grados de elevacion. NEGATIVO = camara por DEBAJO
    // LA COMPENSACION DE CABECEO, y es la contracara exacta de mirar desde abajo. Con la camara
    // por debajo, la TROMPA —que esta mas lejos— se proyecta hacia ABAJO, y un avion nivelado se
    // dibuja bajando. Lo marco Matias en la primera horneada: "esta muy inclinado de base como si
    // estuviese bajando". Es el mismo efecto que ya habia aparecido en la Chancha.
    //
    // Se corrige levantandole la nariz al MODELO hasta que su eje quede horizontal DENTRO del
    // frame. El numero no se eligio a ojo: se horneo un barrido 0/3/5/7/10 y se midio el angulo
    // del eje sobre el alfa (la punta mas a la derecha contra el centroide del naranja del
    // escape). Da -9.72° sin compensar, -2.83° con +5 y **-0.21° con +7**, que es recto.
    // Si se toca RAS_ELEV hay que volver a medirlo: la compensacion es del orden de 0,7 * elev.
    const RAS_PITCH = 7;

    // EL HORNO ES COMPARTIDO (tools/bake_common.js): luz, camara y primitivas salen de ahi para
    // los cuatro horneadores. Aca solo quedan los parametros de ESTA familia de hojas.
    //
    // ENCUADRE: 24° verticales sobre un frame de 84x48. Al agrandar el frame a 84x84 hay que
    // recalcular el fov vertical para que el campo HORIZONTAL no cambie — si no, al achatar el
    // aspecto el avion se agrandaria a lo ancho y se saldria por los costados. Eso es `ref`.
    //
    // ALTURA DE LA CAMARA: 2.4, no 1.1. Desde una vista trasera a NIVEL, un ala se ve de canto y
    // queda como una aguja — un delta no se distingue de un ala recta. Un poco mas arriba se ve
    // la PLANTA del ala, que es lo que identifica a cada avion.
    const CAM = { fov: 24, ref: 84 / 48, pos: [0, 2.4, 12.5], lookY: 0.15 };
    const makeRenderer = () => BAKE.renderer(THREE, FW, FH);
    const makeScene = () => BAKE.escena(THREE);
    const makeCam = () => BAKE.camara(THREE, FW, FH, CAM);

    /** LA CAMARA DE LA HOJA 3, en POLARES alrededor del mismo punto de mira. `BAKE.camara` no
     *  sirve tal cual porque toma una posicion cartesiana y aca lo que se quiere es GIRAR el rig
     *  conservando distancia — que es la misma idea que la perilla `elev` de bake_enemies.html,
     *  con un eje mas. El recalculo de `ref` se repite igual: el frame es cuadrado y el fov es
     *  vertical, asi que sin eso el campo HORIZONTAL cambiaria y el avion se saldria de la celda. */
    const DIST3 = Math.hypot(CAM.pos[1] - CAM.lookY, CAM.pos[2]);   // la distancia de la hoja base
    function makeCam3() {
      const e = RAS_ELEV * Math.PI / 180, a = RAS_YAW * Math.PI / 180;
      const y = DIST3 * Math.sin(e), h = DIST3 * Math.cos(e);
      const asp = FW3 / FH3;
      const halfH = Math.tan(CAM.fov * Math.PI / 360) * CAM.ref / asp;
      const c = new THREE.PerspectiveCamera(2 * Math.atan(halfH) * 180 / Math.PI, asp, 1, 100);
      c.position.set(h * Math.sin(a), CAM.lookY + y, h * Math.cos(a));
      c.lookAt(0, CAM.lookY, 0);
      return c;
    }

    // LOS MODELOS VIVEN EN tools/models/planes.js (PLAN_HORNEADO B0): un horneador es un
    // ENCUADRE (que camara, que poses, que grilla) y un modelo es una SILUETA. Este archivo se
    // queda con lo primero.
    const MODELS = BAKE.familia('planes');

    // hornea todos los sheets; devuelve { key: dataURL_png }
    /** Espeja la mitad DERECHA sobre la izquierda en la columna del medio (la pose sin alabeo).
     *  El eje es el centro del frame, que es donde el modelo esta centrado por construccion —
     *  medido sobre las hojas: la caja del avion cae en x15-68 de 84, centro exacto 42.0. */
    // LA SIMETRIA DEL FRAME NIVELADO la hace el horno (BAKE.simetrizaCentro): el sprite de
    // alabeo 0 sale de una proyeccion en perspectiva y el rasterizado deja el ala izquierda medio
    // pixel corrida respecto de la derecha. Se espeja la mitad derecha sobre la izquierda.
    const CENTRO = (ANGLES.length - 1) / 2;
    const simetriza = (x2, cv) => BAKE.simetrizaCentro(x2, cv, FW, FH, CENTRO);

    function __bake() {
      const R = makeRenderer(), cam = makeCam();
      // un SEGUNDO renderer: el de arriba esta atado al frame de 84 y la hoja del poder va a 168
      const R3 = BAKE.renderer(THREE, FW3, FH3), cam3 = makeCam3();
      const outEl = document.getElementById('out');
      const result = {};
      for (const key in MODELS) {
        const sc = makeScene();
        const model = MODELS[key]();
        sc.add(model);
        const sheet = document.createElement('canvas');
        sheet.width = FW * ANGLES.length; sheet.height = FH * PITCHES.length;
        const x2 = sheet.getContext('2d');
        PITCHES.forEach((pa, row) => {
          model.rotation.x = pa * Math.PI / 180;
          ANGLES.forEach((a, i) => {
            model.rotation.z = a * Math.PI / 180;
            R.render(sc, cam);
            x2.drawImage(R.domElement, i * FW, row * FH);
          });
        });
        const sheet2 = document.createElement('canvas');
        sheet2.width = FW * ANGLES.length; sheet2.height = FH * STEEP.length;
        const x22 = sheet2.getContext('2d');
        STEEP.forEach((pa, row) => {
          model.rotation.x = pa * Math.PI / 180;
          ANGLES.forEach((a, i) => {
            model.rotation.z = a * Math.PI / 180;
            R.render(sc, cam);
            x22.drawImage(R.domElement, i * FW, row * FH);
          });
        });
        // LA HOJA DEL PODER: misma grilla, otro punto de vista, y frame al doble.
        const sheet3 = document.createElement('canvas');
        sheet3.width = FW3 * ANGLES.length; sheet3.height = FH3 * PITCHES.length;
        const x23 = sheet3.getContext('2d');
        PITCHES.forEach((pa, row) => {
          model.rotation.x = (pa + RAS_PITCH) * Math.PI / 180;   // + la compensacion (ver RAS_PITCH)
          ANGLES.forEach((a, i) => {
            model.rotation.z = a * Math.PI / 180;
            R3.render(sc, cam3);
            x23.drawImage(R3.domElement, i * FW3, row * FH3);
          });
        });
        // ESTA NO SE SIMETRIZA, y es la unica del horno que no. `simetrizaCentro` espeja la mitad
        // derecha sobre la izquierda en la columna nivelada para corregir el medio pixel que deja
        // el rasterizado — y eso SOLO vale si la pose es simetrica en pantalla. Desde 35° al
        // costado el avion no lo es: espejarlo le pegaria el flanco derecho de los dos lados y le
        // borraria el escorzo, que es justo lo que esta hoja viene a comprar.

        // SIMETRIZAR EL FRAME NIVELADO, dentro del horneo y no como parche despues.
        //
        // POR QUE HACE FALTA: el modelo es simetrico y la camara esta en el eje (cam.position.x = 0),
        // pero la LUZ no — la principal viene de la izquierda (-3,5,4) y el contraluz de la derecha.
        // Eso es lo que le da volumen al avion en las poses banqueadas y hay que conservarlo. Pero en
        // la pose NIVELADA, vista de frente, esa misma luz deja las dos alas apenas distintas: unas
        // filas de pixeles de borde y medio tono de diferencia. A 480x270 el avion ocupa 50 px y eso
        // se ve como si estuviera torcido.
        //
        // Se corrige SOLO en la columna del medio, que es la unica pose que el ojo espera simetrica.
        // Las banqueadas no se tocan: ahi la asimetria es la pose, no un defecto.
        simetriza(x2, sheet);
        simetriza(x22, sheet2);
        result[key] = { sheet: sheet.toDataURL('image/png'), sheet2: sheet2.toDataURL('image/png'),
                        sheet3: sheet3.toDataURL('image/png') };
        if (outEl) {   // vista previa (modo browser)
          const h = document.createElement('h2'); h.textContent = key + ' — ' + ANGLES.length + 'x' + PITCHES.length + ' frames de ' + FW + 'x' + FH + ' (filas: trepa/nivel/pica)';
          const big = document.createElement('canvas'); big.className = 'sheet';
          big.width = sheet.width * 4; big.height = sheet.height * 4;
          const bx = big.getContext('2d'); bx.imageSmoothingEnabled = false;
          bx.drawImage(sheet, 0, 0, big.width, big.height);
          outEl.appendChild(h); outEl.appendChild(big);
          const img2 = new Image(); img2.className = 'sheet'; img2.style.width = (sheet.width * 4) + 'px';
          img2.src = result[key].sheet2; outEl.appendChild(img2);
        }
      }
      return result;
    }
    window.__bake = __bake;

    /** EL MARGEN DE LA HOJA 3, medido sobre el alfa. El horno de aviones nunca midio nada —las
     *  hojas base llevan siete años de encuadre validado a ojo— pero la hoja del poder gira el
     *  avion 35° al costado y eso proyecta media eslora que antes no ocupaba ancho. Los dos deltas
     *  (dagger y mirage) son los que menos aire tienen. Si se cortan, se ve aca antes que en el
     *  juego. Es la regla 5 del plan (2 px de aire) aplicada por fin a esta familia. */
    window.__margen3 = async () => {
      const out = {};
      const r = __bake();
      for (const k in r) {
        const m = await BAKE.medir(r[k].sheet3, FW3, FH3);
        out[k] = { margen: m.margen, box: m.box };
      }
      return out;
    };
    if (!navigator.userAgent.includes('Electron')) __bake();   // en browser: hornear y mostrar
  </script>
</body>

</html>
