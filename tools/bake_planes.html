<!doctype html>
<html lang="es">
<!-- HERRAMIENTA: hornea los sprite sheets de los aviones desde modelos 3D low-poly.
     - Abrir en browser (con el server del repo) para VER/tunear los modelos.
     - `npx electron tools/bake_planes_run.js` los exporta a assets/planes/<slug>/sheet.png
     Formato de sheet: 9 columnas (alabeo -60..+60 cada 15, la 4 = nivelado) x 3 filas
     (cabeceo: trepa/nivel/pica), frames de 84x84. Si el arte final lo dibuja un humano,
     debe respetar este layout. -->

<head>
  <meta charset="utf-8">
  <title>bake_planes — RASANTE</title>
  <style>
    body { background: #10161b; color: #93a7ab; font-family: ui-monospace, Menlo, monospace; padding: 20px; }
    h2 { color: #e8a33d; font-size: 14px; margin: 18px 0 6px; }
    canvas.sheet { image-rendering: pixelated; border: 1px solid #2a363d; display: block; }
  </style>
</head>

<body>
  <div id="out"></div>
  <script src="../src/vendor/three.global.js"></script>
  <script src="bake_common.js"></script>
  <script src="models/planes.js"></script>
  <script>
    'use strict';
    // RESOLUCION: 56x32 -> 84x48 (x1.5) al subir la grilla del juego a 480x270. Mismo aspecto
    // (1.75), asi que el encuadre de la camara no cambia. Con 84 px de fuente y el buffer 2x
    // del juego, el sprite se dibuja a 2x EXACTO: pixel art nitido en vez de un estirado 3x.
    // ALTO DEL FRAME: al alabear 60° la envergadura se PARA y pasa a ocupar en vertical casi lo
    // mismo que ocupaba a lo ancho. Con 48 px las puntas de ala quedaban CORTADAS en las columnas
    // extremas. El frame pasa a ser cuadrado: el avion no cambia de tamaño (ver makeCam), solo
    // gana aire arriba y abajo para poder girar entero.
    const FW = 84, FH = 84;                       // tamaño de cada frame
    const ANGLES = [-60, -45, -30, -15, 0, 15, 30, 45, 60];   // alabeo por columna (indice 4 = nivelado)
    const PITCHES = [14, 0, -14];                 // cabeceo por FILA: trepando / nivelado / picando
    // HOJA 2 (sheet2.png): cabeceos EMPINADOS para las PIRUETAS (pop-up, split-s, yo-yos). El
    // ±14 de la hoja base es el cabeceo de crucero; una trepada de combate necesita VERSE
    // brusca. Va en hoja aparte: el build web la descarta (limite de 16 MB) y el render cae a
    // las filas normales — la pirueta se sigue jugando igual, solo pierde pose.
    const STEEP = [32, -32];

    // ============================ HOJA 3 (sheet3.png) — LA DEL PODER RASANTE ============================
    // MISMA GRILLA que la hoja base (9 alabeos x 3 cabeceos) para que el render no necesite ni una
    // linea de logica nueva: `colPose` y `rowPose` de render/plane.js sirven igual, y si la hoja no
    // cargo se cae a la de siempre sin pensar. Lo unico que cambia es DESDE DONDE se mira.
    //
    // POR QUE EXISTE. Durante el poder la camara se corre `lat` = 10 unidades a la derecha mientras
    // el avion sigue clavado a z = 14, o sea que lo mira desde 35,5° AL COSTADO — y el sprite esta
    // horneado de cola pura. El avion queda de espaldas a una camara que lo ve de tres cuartos, y
    // eso es lo que se lee como "plano". No es una impresion: son 35,54° que faltan, medidos
    // (atan(10/14)), y es la divergencia 16 de SPEC_PODER_RASANTE escrita con numeros.
    //
    // LA ELEVACION ES OTRA HISTORIA, Y ES UNA MENTIRA DELIBERADA. La camara del poder esta 3.0
    // unidades ARRIBA del avion (`lift`), o sea +9,9° — casi exactamente los +10,2° con los que ya
    // se hornea la hoja base. Por geometria no habria que tocarla. Pero desde arriba no se ve la
    // PANZA, y la panza celeste es la mitad de la silueta de un A-4 contra el cielo; la referencia
    // que eligio el autor (Rasant) mira la nave desde abajo y de eso vive su encuadre. Asi que esta
    // hoja se hornea desde ABAJO y la camara del juego baja lo que el motor le permite para que el
    // mundo no la contradiga (ver RAS_CAMS en data/tuning.js).
    // Es el mismo precedente que la Chancha, al reves: alla la geometria pedia 31° y se horneo a 12
    // porque 31 se leia como una picada; aca la geometria pide +10 y se hornea en -10 porque +10 se
    // lee como una calcomania. EL ANGULO QUE MANDA ES EL QUE SE LEE, y las dos veces se eligio
    // mirando un barrido, no razonando.
    const FW3 = 168, FH3 = 168;          // el DOBLE de la hoja base: durante el poder el sprite se
                                         // dibuja a 142,8 px de mundo, o sea 3,4 px de pantalla por
                                         // pixel horneado. Con 168 vuelve a 1,7 — la misma nitidez
                                         // que tiene el avion en el pasillo, al doble de tamaño.
    const RAS_YAW = 35.5;                // grados de camara hacia +x (se ve el flanco DERECHO, que
                                         // es el lado desde el que mira: `lat` positivo)
    const RAS_ELEV = -10;                // grados de elevacion. NEGATIVO = camara por DEBAJO
    // LA COMPENSACION DE CABECEO, y es la contracara exacta de mirar desde abajo. Con la camara
    // por debajo, la TROMPA —que esta mas lejos— se proyecta hacia ABAJO, y un avion nivelado se
    // dibuja bajando. Lo marco Matias en la primera horneada: "esta muy inclinado de base como si
    // estuviese bajando". Es el mismo efecto que ya habia aparecido en la Chancha.
    //
    // Se corrige levantandole la nariz al MODELO hasta que su eje quede horizontal DENTRO del
    // frame. El numero no se eligio a ojo: se horneo un barrido y se midio el angulo del eje
    // sobre el alfa (la punta mas a la derecha contra el centroide del naranja del escape).
    //
    // EL NUMERO SUBIO DE 6 A 20, Y NO POR LA CUENTA: POR EL OJO. Con 6 el eje quedaba en -2° —
    // recto, medido— y Matias igual lo veia "mirando hacia abajo como queriendose estrellar en el
    // agua". Tenia razon, y la explicacion es que RECTO NO ES LO MISMO QUE BIEN: un avion volando
    // a ras a 900 km/h va con la trompa ARRIBA, sosteniendose con angulo de ataque, no clavado en
    // la horizontal. Un sprite perfectamente horizontal sobre un mar que corre se lee cayendo.
    //
    // El valor salio de la pantalla y no de un barrido: la pose que Matias aprobo ("asi estoy
    // manteniendo hacia arriba y QUEDA BIEN") era LA FILA 0 de la horneada anterior, o sea
    // 14 + 6 = 20. Se adopta ese numero como base y las tres filas se corren con el:
    //     fila 0 (trepa) = 34   ·   fila 1 (nivel) = 20   ·   fila 2 (pica) = 6
    // La fila de arriba queda MAS en punta —que es lo que pidio para "el que es arriba de
    // verdad"— y la de abajo queda donde estaba la base, que es un cabeceo suave y no una picada:
    // durante el poder el resorte te tiene contra el agua y una trompa clavada abajo ahi seria
    // mentira.
    const RAS_PITCH = 20;
    // Y LA COMPENSACION DE ALABEO, que aparecio despues y por el mismo camino: Matias vio el
    // avion "como tocando el agua con un ala, como si estuviese doblando". Tambien es cierto, y
    // tambien es la proyeccion — en un tres cuartos REAL las alas NO quedan horizontales en
    // pantalla: la hoja base tiene su linea de alas en 0,00° exactos y esta, sin compensar, en
    // -6,05°. O sea que un 3/4 fotografico se lee como un viraje, y en un juego donde el alabeo
    // ES una mecanica eso no es un detalle: es informacion equivocada.
    //
    // Se corrige rolando el modelo hasta que la linea de alas vuelva a cero. Se midio un barrido
    // de yaw x alabeo con las dos magnitudes a la vez (linea de alas Y eje del fuselaje), porque
    // estan ACOPLADAS: sobre un modelo ya girado en yaw, cabecear tambien inclina las alas.
    // El ganador es este: alas -0,86° y eje -1,98°, las dos paralelas al agua.
    //
    // LO QUE CUESTA, dicho en voz alta: la columna del medio deja de ser "alabeo 0 del mundo" y
    // pasa a ser "alabeo 0 EN PANTALLA". Es la misma clase de mentira que la elevacion, y se paga
    // por el mismo motivo — un recorte 2D se juzga por lo que se lee, no por lo que mide.
    const RAS_ROLL = -8;

    // EL HORNO ES COMPARTIDO (tools/bake_common.js): luz, camara y primitivas salen de ahi para
    // los cuatro horneadores. Aca solo quedan los parametros de ESTA familia de hojas.
    //
    // ENCUADRE: 24° verticales sobre un frame de 84x48. Al agrandar el frame a 84x84 hay que
    // recalcular el fov vertical para que el campo HORIZONTAL no cambie — si no, al achatar el
    // aspecto el avion se agrandaria a lo ancho y se saldria por los costados. Eso es `ref`.
    //
    // ALTURA DE LA CAMARA: 2.4, no 1.1. Desde una vista trasera a NIVEL, un ala se ve de canto y
    // queda como una aguja — un delta no se distingue de un ala recta. Un poco mas arriba se ve
    // la PLANTA del ala, que es lo que identifica a cada avion.
    const CAM = { fov: 24, ref: 84 / 48, pos: [0, 2.4, 12.5], lookY: 0.15 };
    const makeRenderer = () => BAKE.renderer(THREE, FW, FH);
    const makeScene = () => BAKE.escena(THREE);
    const makeCam = () => BAKE.camara(THREE, FW, FH, CAM);

    /** LA CAMARA DE LA HOJA 3, en POLARES alrededor del mismo punto de mira. `BAKE.camara` no
     *  sirve tal cual porque toma una posicion cartesiana y aca lo que se quiere es GIRAR el rig
     *  conservando distancia — que es la misma idea que la perilla `elev` de bake_enemies.html,
     *  con un eje mas. El recalculo de `ref` se repite igual: el frame es cuadrado y el fov es
     *  vertical, asi que sin eso el campo HORIZONTAL cambiaria y el avion se saldria de la celda. */
    const DIST3 = Math.hypot(CAM.pos[1] - CAM.lookY, CAM.pos[2]);   // la distancia de la hoja base
    function makeCam3() {
      const e = RAS_ELEV * Math.PI / 180, a = RAS_YAW * Math.PI / 180;
      const y = DIST3 * Math.sin(e), h = DIST3 * Math.cos(e);
      const asp = FW3 / FH3;
      const halfH = Math.tan(CAM.fov * Math.PI / 360) * CAM.ref / asp;
      const c = new THREE.PerspectiveCamera(2 * Math.atan(halfH) * 180 / Math.PI, asp, 1, 100);
      c.position.set(h * Math.sin(a), CAM.lookY + y, h * Math.cos(a));
      c.lookAt(0, CAM.lookY, 0);
      return c;
    }

    // LOS MODELOS VIVEN EN tools/models/planes.js (PLAN_HORNEADO B0): un horneador es un
    // ENCUADRE (que camara, que poses, que grilla) y un modelo es una SILUETA. Este archivo se
    // queda con lo primero.
    const MODELS = BAKE.familia('planes');

    // hornea todos los sheets; devuelve { key: dataURL_png }
    /** Espeja la mitad DERECHA sobre la izquierda en la columna del medio (la pose sin alabeo).
     *  El eje es el centro del frame, que es donde el modelo esta centrado por construccion —
     *  medido sobre las hojas: la caja del avion cae en x15-68 de 84, centro exacto 42.0. */
    // LA SIMETRIA DEL FRAME NIVELADO la hace el horno (BAKE.simetrizaCentro): el sprite de
    // alabeo 0 sale de una proyeccion en perspectiva y el rasterizado deja el ala izquierda medio
    // pixel corrida respecto de la derecha. Se espeja la mitad derecha sobre la izquierda.
    const CENTRO = (ANGLES.length - 1) / 2;
    const simetriza = (x2, cv) => BAKE.simetrizaCentro(x2, cv, FW, FH, CENTRO);

    // ============================ LAS ANCLAS, MEDIDAS SOBRE LA HOJA ============================
    // Dos cosas que el juego dibuja POR CODIGO encima del sprite y que tienen que caer en un lugar
    // preciso del avion: los VORTICES DE PUNTA DE ALA (y los parches, que cuelgan de la misma
    // linea) y el DISCO DE LA TOBERA. Las dos vivian como tablas a mano en render/plane.js, con la
    // nota "si se re-hornea la hoja con otra geometria de ala, hay que volver a medir esta tabla".
    // Con una sola hoja eso se podia sostener; con dos puntos de vista distintos, no.
    //
    // Se miden con EL MISMO METODO con el que se midio la tabla vieja —el pixel opaco mas a la
    // izquierda y el mas a la derecha de cada frame, y la Y media de esa columna— asi que no es un
    // criterio nuevo: es el mismo, hecho por la maquina. La tobera sale del centroide del naranja
    // emisivo del escape, que es el unico pixel de ese color en todo el frame.
    //
    // Es la misma idea que `puntos` en el horno de enemigos (las helices de la Chancha): el horno
    // mide hechos, y donde quedo dibujada un ala es un hecho.
    /** LAS DOS PUNTAS DE ALA DEL MODELO, en coordenadas del propio modelo. Son los vertices de
     *  |x| maximo de toda la geometria — que en un avion es, siempre, la punta del ala: ninguna
     *  otra parte se aleja tanto del eje.
     *
     *  POR QUE NO SE MIDEN SOBRE EL ALFA, que es como se hacia. Mirando el avion DE COLA el pixel
     *  opaco mas a la izquierda ES la punta del ala, asi que el atajo funcionaba y por eso la
     *  tabla a mano era correcta. Pero la hoja del PODER mira desde 35° al costado, y ahi lo mas
     *  ancho del dibujo ya no es el ala: es el FUSELAJE. Las "puntas" medidas por alfa caian en la
     *  trompa y en la cola — o sea que la estela de punta de ala salia del morro. Lo vio Matias en
     *  la lamina de verificacion.
     *
     *  Con el vertice, la punta es la punta desde cualquier camara. Es la misma leccion que la
     *  Chancha: un punto del MODELO proyectado por el horno no se puede equivocar de pieza; un
     *  atajo sobre la imagen depende de que la camara no cambie. */
    function puntasDe(model) {
      model.updateMatrixWorld(true);
      const v = new THREE.Vector3();
      let minX = 1e9, maxX = -1e9, L = null, R = null;
      model.traverse(o => {
        if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
        const pos = o.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
          if (v.x < minX) { minX = v.x; L = v.clone(); }
          if (v.x > maxX) { maxX = v.x; R = v.clone(); }
        }
      });
      return [L, R];
    }

    /** Donde cae un punto del modelo dentro del frame, en fraccion y desde el centro. */
    function alFrame(p, model, cam) {
      const v = p.clone().applyMatrix4(model.matrixWorld).project(cam);
      return [+((v.x * 0.5) ).toFixed(3), +((-v.y * 0.5)).toFixed(3)];
    }

    function anclasDe(canvas, fw, fh, cols, rows, puntas) {
      const g = canvas.getContext('2d');
      const d = g.getImageData(0, 0, canvas.width, canvas.height).data;
      const A = (x, y) => d[(y * canvas.width + x) * 4 + 3];
      const tips = [], tob = [], box = [];
      for (let row = 0; row < rows; row++) {
        const ft = [], fo = [], fb = [];
        for (let col = 0; col < cols; col++) {
          const x0 = col * fw, y0 = row * fh;
          let li = -1, ri = -1, lsum = 0, ln = 0, rsum = 0, rn = 0;
          for (let x = 0; x < fw && li < 0; x++) {
            let sum = 0, n = 0;
            for (let y = 0; y < fh; y++) if (A(x0 + x, y0 + y) > 8) { sum += y; n++; }
            if (n) { li = x; lsum = sum; ln = n; }
          }
          for (let x = fw - 1; x >= 0 && ri < 0; x--) {
            let sum = 0, n = 0;
            for (let y = 0; y < fh; y++) if (A(x0 + x, y0 + y) > 8) { sum += y; n++; }
            if (n) { ri = x; rsum = sum; rn = n; }
          }
          const f = v => +(v).toFixed(3);
          // LAS PUNTAS VIENEN PROYECTADAS DEL MODELO (ver puntasDe): es la punta del ala mire la
          // camara desde donde mire. El alfa se sigue leyendo para el resto (la caja, el perfil).
          const P = puntas[row][col];
          ft.push(P ? [P[0][0], P[0][1], P[1][0], P[1][1]] : [0, 0, 0, 0]);
          void li; void ri; void lsum; void ln; void rsum; void rn;
          // EL ESCAPE: centroide del naranja emisivo (BAKE.PAL.fuegoMedio y sus vecinos)
          let ox = 0, oy = 0, on = 0;
          for (let y = 0; y < fh; y++) for (let x = 0; x < fw; x++) {
            const i = ((y0 + y) * canvas.width + x0 + x) * 4;
            if (d[i + 3] > 8 && d[i] > 190 && d[i + 1] > 90 && d[i + 1] < 190 && d[i + 2] < 90) {
              ox += x; oy += y; on++;
            }
          }
          fo.push(on ? [f((ox / on - fw / 2) / fw), f((oy / on - fh / 2) / fh)] : null);
          // LA CAJA VERTICAL de esta pose: hasta donde llega el avion arriba y abajo. La usan los
          // parches como TOPE — una chapa no puede quedar flotando en el cielo, y desde otro punto
          // de vista el perfil se reordena lo suficiente como para que eso pase.
          let by0 = 1e9, by1 = -1;
          for (let y = 0; y < fh; y++) for (let x = 0; x < fw; x++)
            if (A(x0 + x, y0 + y) > 8) { if (y < by0) by0 = y; if (y > by1) by1 = y; }
          fb.push(by1 < 0 ? [0, 0] : [f((by0 - fh / 2) / fh), f((by1 - fh / 2) / fh)]);
        }
        tips.push(ft); tob.push(fo); box.push(fb);
      }
      // EL PERFIL DE LA POSE NIVELADA: cuanto ocupa el avion adentro del frame. Lo necesitan los
      // PARCHES, cuyas alturas estan escritas como fraccion del frame contra el perfil de la hoja
      // base (el timon arriba, el ala abajo). En otra hoja ese perfil ocupa otra fraccion, asi que
      // las doce alturas se reescalan por la relacion — no se re-inventan.
      const cx = Math.floor(4 * fw), cy = Math.floor(1 * fh);
      let y0 = 1e9, y1 = -1;
      for (let y = 0; y < fh; y++) for (let x = 0; x < fw; x++)
        if (A(cx + x, cy + y) > 8) { if (y < y0) y0 = y; if (y > y1) y1 = y; }
      const alto = y1 < 0 ? 0 : +((y1 - y0 + 1) / fh).toFixed(4);
      // EL PERFIL DE LA SILUETA, en 13 muestras a lo ancho del frame: arriba y abajo de lo OPACO
      // en cada franja. Es el tope real de los parches. La caja sola no alcanza —adentro de un
      // rectangulo todavia hay cielo, y ahi es donde quedaban flotando tres de los doce— y esto
      // es lo mas barato que responde "a esta altura del ala, hasta donde llega el avion".
      const MUESTRAS = 13, perfil = [];
      for (let m = 0; m < MUESTRAS; m++) {
        const xa = Math.floor(m * fw / MUESTRAS), xb = Math.floor((m + 1) * fw / MUESTRAS);
        let a = 1e9, b = -1;
        for (let x = xa; x < xb; x++) for (let y = 0; y < fh; y++)
          if (A(cx + x, cy + y) > 8) { if (y < a) a = y; if (y > b) b = y; }
        perfil.push(b < 0 ? null : [+((a - fh / 2) / fh).toFixed(3), +((b - fh / 2) / fh).toFixed(3)]);
      }
      return { tips, tob, box, alto, perfil };
    }

    // ============================ LAS CAPAS DE CARGA ============================
    // Tanques y bombas no se hornean pegados al avion ni se dibujan a mano encima: se hornean en
    // CAPAS, una por pieza y por punto de carga, con LA MISMA camara y LAS MISMAS poses que cada
    // una de las tres hojas del avion. Asi calzan al pixel en los 27 frames y en las tres vistas.
    //
    // EL TRUCO QUE LO HACE POSIBLE ES EL OCLUSOR. En cada pasada el avion esta en la escena, pero
    // con `colorWrite = false`: escribe PROFUNDIDAD y no pinta nada. El pedazo de tanque que el ala
    // tapa desde esa camara se descarta en la GPU, asi que la capa sale ya recortada. En el juego
    // se pinta el avion y encima las capas que se eligieron — y ninguna tapa al ala que la tapa a
    // ella, desde ninguna de las tres camaras.
    //
    // POR QUE CAPAS Y NO UNA HOJA POR COMBINACION: con dos puntos de carga y tres opciones por
    // punto salen nueve combinaciones, por seis celulas y tres vistas, o sea 162 hojas — y cada
    // arma nueva multiplicaria todo otra vez. Con capas son cuatro por celula y las nueve
    // combinaciones se ARMAN.
    const CARGA = MODELS.__carga;
    const CAPAS = [
      ['carga_tanques_ala', 'tanque', 'ala'], ['carga_bombas_ala', 'bomba', 'ala'],
      ['carga_tanque_centro', 'tanque', 'centro'], ['carga_bomba_centro', 'bomba', 'centro'],
    ];
    function hornearCapas(key, R, cam, R3, cam3) {
      const [celula, colorT] = CARGA.CELULA[key];
      const out = {};
      for (const [nombre, tipo, punto] of CAPAS) {
        const sc = makeScene();
        const model = MODELS[key]();
        // el avion pasa a ser OCLUSOR: profundidad si, color no, y se dibuja PRIMERO (si la carga
        // se pintara antes, el oclusor llegaria tarde y no podria borrar lo que ya estaba)
        model.traverse(o => {
          if (!o.isMesh) return;
          o.material = o.material.clone();
          o.material.colorWrite = false;
          o.renderOrder = -1;
        });
        CARGA.colgar(model, celula, tipo, punto, colorT);
        sc.add(model);
        const hoja = (Rr, cm, fw, fh, filas, dPitch, dRoll) => {
          const cv = document.createElement('canvas');
          cv.width = fw * ANGLES.length; cv.height = fh * filas.length;
          const g = cv.getContext('2d');
          filas.forEach((pa, row) => {
            model.rotation.x = (pa + dPitch) * Math.PI / 180;
            ANGLES.forEach((a, i) => {
              model.rotation.z = (a + dRoll) * Math.PI / 180;
              Rr.render(sc, cm);
              g.drawImage(Rr.domElement, i * fw, row * fh);
            });
          });
          return [cv, g];
        };
        const [c1, g1] = hoja(R, cam, FW, FH, PITCHES, 0, 0);
        const [c2, g2] = hoja(R, cam, FW, FH, STEEP, 0, 0);
        const [c3] = hoja(R3, cam3, FW3, FH3, PITCHES, RAS_PITCH, RAS_ROLL);
        // la misma simetrizacion que el avion en sus dos hojas de cola, o la capa del frame
        // nivelado quedaria medio pixel corrida respecto del ala que la sostiene
        simetriza(g1, c1); simetriza(g2, c2);
        out[nombre] = { s1: c1.toDataURL('image/png'), s2: c2.toDataURL('image/png'), s3: c3.toDataURL('image/png') };
      }
      return out;
    }

    let ANCLAS = {};
    function __bake() {
      const R = makeRenderer(), cam = makeCam();
      // un SEGUNDO renderer: el de arriba esta atado al frame de 84 y la hoja del poder va a 168
      const R3 = BAKE.renderer(THREE, FW3, FH3), cam3 = makeCam3();
      const outEl = document.getElementById('out');
      const result = {};
      ANCLAS = {};
      for (const key in MODELS) {
        const sc = makeScene();
        const model = MODELS[key]();
        sc.add(model);
        const sheet = document.createElement('canvas');
        sheet.width = FW * ANGLES.length; sheet.height = FH * PITCHES.length;
        const x2 = sheet.getContext('2d');
        const pt0 = puntasDe(model);            // las dos puntas, en el modelo sin posar
        const PU_BASE = [], PU_RAS = [];
        PITCHES.forEach((pa, row) => {
          model.rotation.x = pa * Math.PI / 180;
          const fb = [];
          ANGLES.forEach((a, i) => {
            model.rotation.z = a * Math.PI / 180;
            R.render(sc, cam);
            x2.drawImage(R.domElement, i * FW, row * FH);
            model.updateMatrixWorld(true);
            fb.push([alFrame(pt0[0], model, cam), alFrame(pt0[1], model, cam)]);
          });
          PU_BASE.push(fb);
        });
        const sheet2 = document.createElement('canvas');
        sheet2.width = FW * ANGLES.length; sheet2.height = FH * STEEP.length;
        const x22 = sheet2.getContext('2d');
        STEEP.forEach((pa, row) => {
          model.rotation.x = pa * Math.PI / 180;
          ANGLES.forEach((a, i) => {
            model.rotation.z = a * Math.PI / 180;
            R.render(sc, cam);
            x22.drawImage(R.domElement, i * FW, row * FH);
          });
        });
        // LA HOJA DEL PODER: misma grilla, otro punto de vista, y frame al doble.
        const sheet3 = document.createElement('canvas');
        sheet3.width = FW3 * ANGLES.length; sheet3.height = FH3 * PITCHES.length;
        const x23 = sheet3.getContext('2d');
        PITCHES.forEach((pa, row) => {
          model.rotation.x = (pa + RAS_PITCH) * Math.PI / 180;   // + la compensacion (ver RAS_PITCH)
          const fr = [];
          ANGLES.forEach((a, i) => {
            model.rotation.z = (a + RAS_ROLL) * Math.PI / 180;   // + la compensacion (ver RAS_ROLL)
            R3.render(sc, cam3);
            x23.drawImage(R3.domElement, i * FW3, row * FH3);
            model.updateMatrixWorld(true);
            fr.push([alFrame(pt0[0], model, cam3), alFrame(pt0[1], model, cam3)]);
          });
          PU_RAS.push(fr);
        });
        // ESTA NO SE SIMETRIZA, y es la unica del horno que no. `simetrizaCentro` espeja la mitad
        // derecha sobre la izquierda en la columna nivelada para corregir el medio pixel que deja
        // el rasterizado — y eso SOLO vale si la pose es simetrica en pantalla. Desde 35° al
        // costado el avion no lo es: espejarlo le pegaria el flanco derecho de los dos lados y le
        // borraria el escorzo, que es justo lo que esta hoja viene a comprar.

        // SIMETRIZAR EL FRAME NIVELADO, dentro del horneo y no como parche despues.
        //
        // POR QUE HACE FALTA: el modelo es simetrico y la camara esta en el eje (cam.position.x = 0),
        // pero la LUZ no — la principal viene de la izquierda (-3,5,4) y el contraluz de la derecha.
        // Eso es lo que le da volumen al avion en las poses banqueadas y hay que conservarlo. Pero en
        // la pose NIVELADA, vista de frente, esa misma luz deja las dos alas apenas distintas: unas
        // filas de pixeles de borde y medio tono de diferencia. A 480x270 el avion ocupa 50 px y eso
        // se ve como si estuviera torcido.
        //
        // Se corrige SOLO en la columna del medio, que es la unica pose que el ojo espera simetrica.
        // Las banqueadas no se tocan: ahi la asimetria es la pose, no un defecto.
        simetriza(x2, sheet);
        simetriza(x22, sheet2);
        result[key] = { sheet: sheet.toDataURL('image/png'), sheet2: sheet2.toDataURL('image/png'),
                        sheet3: sheet3.toDataURL('image/png') };
        // las anclas de las dos hojas que el juego dibuja encima (la 2 no las necesita: durante
        // una pirueta empinada no hay parches ni estela de punta que valgan)
        ANCLAS[key] = {
          base: anclasDe(sheet, FW, FH, ANGLES.length, PITCHES.length, PU_BASE),
          ras: anclasDe(sheet3, FW3, FH3, ANGLES.length, PITCHES.length, PU_RAS),
        };
        // LAS CAPAS DE CARGA (solo las celulas del roster; las skins comparten las del A-4)
        if (CARGA.CELULA[key]) result[key].capas = hornearCapas(key, R, cam, R3, cam3);
        if (outEl) {   // vista previa (modo browser)
          const h = document.createElement('h2'); h.textContent = key + ' — ' + ANGLES.length + 'x' + PITCHES.length + ' frames de ' + FW + 'x' + FH + ' (filas: trepa/nivel/pica)';
          const big = document.createElement('canvas'); big.className = 'sheet';
          big.width = sheet.width * 4; big.height = sheet.height * 4;
          const bx = big.getContext('2d'); bx.imageSmoothingEnabled = false;
          bx.drawImage(sheet, 0, 0, big.width, big.height);
          outEl.appendChild(h); outEl.appendChild(big);
          const img2 = new Image(); img2.className = 'sheet'; img2.style.width = (sheet.width * 4) + 'px';
          img2.src = result[key].sheet2; outEl.appendChild(img2);
        }
      }
      return result;
    }
    window.__bake = __bake;
    /** Las anclas de la ultima horneada. El runner las escribe en src/data/anclas.js. */
    window.__anclas = () => { if (!Object.keys(ANCLAS).length) __bake(); return ANCLAS; };

    /** EL MARGEN DE LA HOJA 3, medido sobre el alfa. El horno de aviones nunca midio nada —las
     *  hojas base llevan siete años de encuadre validado a ojo— pero la hoja del poder gira el
     *  avion 35° al costado y eso proyecta media eslora que antes no ocupaba ancho. Los dos deltas
     *  (dagger y mirage) son los que menos aire tienen. Si se cortan, se ve aca antes que en el
     *  juego. Es la regla 5 del plan (2 px de aire) aplicada por fin a esta familia. */
    window.__margen3 = async () => {
      const out = {};
      const r = __bake();
      for (const k in r) {
        const m = await BAKE.medir(r[k].sheet3, FW3, FH3);
        out[k] = { margen: m.margen, box: m.box };
      }
      return out;
    };
    if (!navigator.userAgent.includes('Electron')) __bake();   // en browser: hornear y mostrar
  </script>
</body>
