<!doctype html>
<html lang="es">
<!-- HERRAMIENTA: hornea los sprite sheets de los aviones desde modelos 3D low-poly.
     - Abrir en browser (con el server del repo) para VER/tunear los modelos.
     - `npx electron tools/bake_planes_run.js` los exporta a assets/planes/<slug>/sheet.png
     Formato de sheet: 9 columnas (alabeo -60..+60 cada 15, la 4 = nivelado) x 3 filas
     (cabeceo: trepa/nivel/pica), frames de 84x84. Si el arte final lo dibuja un humano,
     debe respetar este layout. -->

<head>
  <meta charset="utf-8">
  <title>bake_planes — RASANTE</title>
  <style>
    body { background: #10161b; color: #93a7ab; font-family: ui-monospace, Menlo, monospace; padding: 20px; }
    h2 { color: #e8a33d; font-size: 14px; margin: 18px 0 6px; }
    canvas.sheet { image-rendering: pixelated; border: 1px solid #2a363d; display: block; }
  </style>
</head>

<body>
  <div id="out"></div>
  <script src="../src/vendor/three.global.js"></script>
  <script>
    'use strict';
    // RESOLUCION: 56x32 -> 84x48 (x1.5) al subir la grilla del juego a 480x270. Mismo aspecto
    // (1.75), asi que el encuadre de la camara no cambia. Con 84 px de fuente y el buffer 2x
    // del juego, el sprite se dibuja a 2x EXACTO: pixel art nitido en vez de un estirado 3x.
    // ALTO DEL FRAME: al alabear 60° la envergadura se PARA y pasa a ocupar en vertical casi lo
    // mismo que ocupaba a lo ancho. Con 48 px las puntas de ala quedaban CORTADAS en las columnas
    // extremas. El frame pasa a ser cuadrado: el avion no cambia de tamaño (ver makeCam), solo
    // gana aire arriba y abajo para poder girar entero.
    const FW = 84, FH = 84;                       // tamaño de cada frame
    const ANGLES = [-60, -45, -30, -15, 0, 15, 30, 45, 60];   // alabeo por columna (indice 4 = nivelado)
    const PITCHES = [14, 0, -14];                 // cabeceo por FILA: trepando / nivelado / picando

    // paleta compartida con el juego (atardecer)
    const CANOPY = '#8fd0e0', ACCENT = '#e8a33d', EXHAUST = '#2b2f28';

    function makeRenderer() {
      const r = new THREE.WebGLRenderer({ antialias: false, alpha: true });
      r.setSize(FW, FH, false);
      return r;
    }
    function makeScene() {
      const sc = new THREE.Scene();
      sc.add(new THREE.AmbientLight(0xaebccc, 1.5));
      const dl = new THREE.DirectionalLight(0xe8c07a, 1.6); dl.position.set(-3, 5, 4); sc.add(dl);
      const rim = new THREE.DirectionalLight(0xb06a35, 0.5); rim.position.set(2, 1, -4); sc.add(rim);
      return sc;
    }
    // ENCUADRE ORIGINAL: 24° verticales sobre un frame de 84x48. Al agrandar el frame hay que
    // RECALCULAR el fov vertical para que el campo HORIZONTAL no cambie — si no, al achatar el
    // aspecto el avion se agrandaria a lo ancho y se saldria por los costados.
    const BASE_FOV = 24, BASE_ASPECT = 84 / 48;
    function makeCam() {
      const halfH = Math.tan(BASE_FOV * Math.PI / 360) * BASE_ASPECT / (FW / FH);
      const fov = 2 * Math.atan(halfH) * 180 / Math.PI;
      const cam = new THREE.PerspectiveCamera(fov, FW / FH, 1, 100);
      // ALTURA DE LA CAMARA: subida de 1.1 a 2.4. Desde una vista trasera a NIVEL, un ala se ve
      // de canto y queda como una aguja — un delta no se distingue de un ala recta. Con la camara
      // un poco mas arriba se ve la PLANTA del ala, que es lo que identifica a cada avion.
      cam.position.set(0, 2.4, 12.5); cam.lookAt(0, 0.15, 0);
      return cam;
    }
    const B = (g, w, h, d, c, x, y, z, ry) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: c }));
      m.position.set(x, y, z); if (ry) m.rotation.y = ry;
      g.add(m); return m;
    };

    // ---------- PRIMITIVAS DE VOLUMEN ----------
    // Antes TODO era BoxGeometry: el fuselaje era un prisma y las alas, escaleras de cajas. Con
    // cuerpos redondos y plantas de ala reales el sprite gana silueta y sombreado curvo, que es
    // lo que se lee a 84x48 (mucho mas que el detalle chico).
    const MAT = c => new THREE.MeshLambertMaterial({ color: c });
    const add = (g, geo, c, x, y, z, rx, ry, rz) => {
      const m = new THREE.Mesh(geo, MAT(c));
      m.position.set(x, y, z);
      if (rx) m.rotation.x = rx; if (ry) m.rotation.y = ry; if (rz) m.rotation.z = rz;
      g.add(m); return m;
    };
    /** Cilindro a lo LARGO DEL EJE Z (el eje del avion). rT = radio hacia la nariz. */
    const CYL = (g, rT, rB, len, c, x, y, z, seg) =>
      add(g, new THREE.CylinderGeometry(rT, rB, len, seg || 10), c, x, y, z, Math.PI / 2);
    /** Cono sobre Z. `back=true` lo apunta hacia la cola (tobera); si no, hacia la nariz. */
    const CONE = (g, r, len, c, x, y, z, back, seg) =>
      add(g, new THREE.ConeGeometry(r, len, seg || 10), c, x, y, z, back ? Math.PI / 2 : -Math.PI / 2);
    /** Esfera achatada — cabinas y carenados. */
    const DOME = (g, r, c, x, y, z, sx, sy, sz) => {
      const m = add(g, new THREE.SphereGeometry(r, 10, 7), c, x, y, z);
      m.scale.set(sx || 1, sy || 1, sz || 1); return m;
    };
    /** PLANTA extruida: recibe puntos [x, adelante] y los extruye en grosor VERTICAL.
     *  Es lo que permite un borde de ataque en flecha CONTINUO — con cajas quedaba escalonado. */
    // Devuelve un GRUPO, no el mesh: PLATE ya gasta su rotacion en X para acostar la planta, y
    // encadenar un segundo giro sobre el mismo objeto da un euler compuesto que no es el que uno
    // espera (asi salio la primera deriva: un hilo tirado de costado). Con el grupo, el que llama
    // puede inclinar o parar la superficie sin tocar la rotacion interna.
    function PLATE(g, pts, thick, c, x, y, z) {
      const sh = new THREE.Shape();
      sh.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) sh.lineTo(pts[i][0], pts[i][1]);
      sh.closePath();
      const m = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: thick, bevelEnabled: false }), MAT(c));
      m.rotation.x = -Math.PI / 2;   // el extruido crece en +Z local -> pasa a ser la vertical
      const grp = new THREE.Group();
      grp.add(m); grp.position.set(x, y, z); g.add(grp);
      return grp;
    }
    /** Ala/estabilizador: envergadura, cuerda de raiz, cuerda de punta y FLECHA (cuanto retrasa
     *  la punta). Con `dih` se arma en DOS MITADES inclinadas — diedro positivo o negativo. Vale
     *  la pena: cada mitad toma la luz distinto y el ala deja de leerse como una barra plana. */
    function WING(g, span, root, tip, sweep, thick, c, y, z, dih) {
      const s = span / 2, le = root / 2, teTip = le - sweep - tip;
      if (!dih) return PLATE(g, [[-s, le - sweep], [0, le], [s, le - sweep], [s, teTip], [0, -le], [-s, teTip]],
        thick, c, 0, y, z);
      const grp = new THREE.Group(); grp.position.set(0, y, z); g.add(grp);
      for (const sg of [-1, 1]) {
        const half = PLATE(grp, [[0, le], [sg * s, le - sweep], [sg * s, teTip], [0, -le]], thick, c, 0, 0, 0);
        half.rotation.z = -sg * dih * Math.PI / 180;
      }
      return grp;
    }
    /** Deriva: la misma planta, PARADA. */
    function FIN(g, h, root, tip, sweep, thick, c, y, z) {
      const le = root / 2, teTip = le - sweep - tip;
      const grp = PLATE(g, [[0, le], [h, le - sweep], [h, teTip], [0, -le]], thick, c, thick / 2, y, z);
      grp.rotation.z = Math.PI / 2;                    // de horizontal a vertical
      return grp;
    }

    // ---------- modelos (vista trasera: nariz hacia -z, cola hacia +z/camara) ----------
    // La camara mira DESDE ATRAS y un poco por arriba, asi que lo que se lee a 84x48 es, en orden:
    // la silueta del ala, la deriva, el redondeo del fuselaje y la boca de escape. El detalle
    // chico (paneles, escarapelas) se pierde — por eso el presupuesto de poligonos va al VOLUMEN.

    /** Escape comun a todos: anillo metalico + boca oscura hundida + tobera conica. */
    function nozzle(g, r, z, ring, dark) {
      CYL(g, r, r * 0.92, 0.5, ring, 0, 0, z, 12);
      CYL(g, r * 0.66, r * 0.66, 0.26, dark, 0, 0, z + 0.2, 12);
      CONE(g, r * 0.5, 0.34, '#191c15', 0, 0, z + 0.34, true, 10);
    }
    /** Tanque subalar / pod: cilindro con punta y cola conicas. */
    function tank(g, r, len, c, x, y, z) {
      CYL(g, r, r, len, c, x, y, z, 8);
      CONE(g, r, r * 2.4, c, x, y, z - len / 2 - r * 1.2, false, 8);
      CONE(g, r, r * 1.6, c, x, y, z + len / 2 + r * 0.8, true, 8);
    }

    // A-4 SKYHAWK (camo FAA) y A-4Q (esquema naval de la Armada): misma celula, distinta pintura.
    // Rasgos que lo identifican: delta RECORTADO muy corto, estabilizador ALTO sobre la deriva,
    // tomas de aire laterales tipo "oreja" pegadas a la cabina y fuselaje corto y rechoncho.
    function modelA4(camoA, camoB, patch, belly) {
      const g = new THREE.Group();
      CYL(g, 0.42, 0.40, 5.0, camoA, 0, 0, 0.1, 12);              // fuselaje redondo
      CONE(g, 0.40, 1.5, camoA, 0, 0, -3.15, false, 12);          // morro afinado
      CYL(g, 0.30, 0.26, 0.5, camoB, 0, -0.02, -3.85, 10);        // tubo de pitot / punta
      // ALA: delta recortado, de una pieza y con anhedral leve (el A-4 lo tiene marcado)
      WING(g, 5.1, 2.5, 0.85, 1.5, 0.14, camoB, -0.16, 0.85);
      WING(g, 5.1, 2.5, 0.85, 1.5, 0.03, belly, -0.235, 0.85);    // panza clara asomando por debajo
      // CAMO: las manchas van a y=0.02, que es JUSTO ENCIMA de la cara superior del ala (el ala
      // arranca en -0.16 y tiene 0.17 de espesor -> su techo esta en 0.01). Puestas mas abajo
      // quedaban DENTRO del ala y el avion se veia de un solo color.
      B(g, 1.9, 0.05, 1.15, patch, -1.2, 0.02, 0.6);
      B(g, 1.45, 0.05, 0.95, patch, 1.35, 0.02, 1.05);
      B(g, 1.15, 0.05, 0.8, patch, 0.25, 0.02, 0.05);
      B(g, 0.9, 0.05, 0.7, patch, -2.0, 0.02, 1.2);
      CYL(g, 0.44, 0.42, 1.9, patch, 0, 0, -0.9, 12);             // banda de camo sobre el lomo
      // COLA: estabilizador ALTO — la firma del Skyhawk
      WING(g, 2.3, 0.95, 0.5, 0.5, 0.13, camoB, 0.95, 2.25);
      FIN(g, 1.35, 1.25, 0.55, 0.85, 0.11, camoA, 0.12, 2.1);
      B(g, 0.13, 0.34, 0.5, ACCENT, 0, 1.28, 2.35);               // banda de punta de deriva
      // CABINA: burbuja baja y corta
      DOME(g, 0.34, CANOPY, 0, 0.42, -1.5, 0.85, 0.8, 1.9);
      CYL(g, 0.30, 0.34, 1.4, camoA, 0, 0.22, -1.35, 10);         // lomo detras de la cabina
      // TOMAS DE AIRE laterales
      CYL(g, 0.27, 0.29, 1.5, camoB, -0.62, 0.10, -0.5, 8);
      CYL(g, 0.27, 0.29, 1.5, camoB, 0.62, 0.10, -0.5, 8);
      CYL(g, 0.19, 0.19, 0.3, '#1b1f17', -0.66, 0.10, -1.22, 8);
      CYL(g, 0.19, 0.19, 0.3, '#1b1f17', 0.66, 0.10, -1.22, 8);
      tank(g, 0.17, 1.5, belly, -1.45, -0.42, 0.5);
      tank(g, 0.17, 1.5, belly, 1.45, -0.42, 0.5);
      nozzle(g, 0.34, 2.75, camoB, '#25291f');
      return g;
    }

    // IAI DAGGER (Mirage 5, camo desierto israeli): DELTA PURO, sin estabilizador horizontal —
    // esa ausencia es lo que lo distingue del A-4 de un vistazo.
    function modelDagger() {
      const g = new THREE.Group();
      // camo argentino del Dagger: VERDE oscuro con manchas AMARILLO ARENA y panza gris azulada.
      // (la primera version salio marron: era el esquema desierto israeli, no el de la FAA)
      const grn = '#4e6136', yel = '#c0ab5e', grn2 = '#3d4d2c', belly = '#93a3ae';
      CYL(g, 0.36, 0.34, 5.6, grn, 0, 0.04, 0.1, 12);
      CONE(g, 0.34, 1.8, grn, 0, 0.04, -3.4, false, 12);         // morro largo (Mirage 5: sin radar grande)
      WING(g, 6.0, 4.6, 0.35, 3.9, 0.17, grn, -0.14, 0.9);       // DELTA: flecha fuerte, punta minima
      WING(g, 6.0, 4.6, 0.35, 3.9, 0.03, belly, -0.215, 0.9);
      // manchas AMARILLO ARENA, a y=0.04 (techo del delta: -0.14 + 0.17 = 0.03)
      B(g, 2.2, 0.05, 1.6, yel, -1.4, 0.04, 0.9);
      B(g, 1.8, 0.05, 1.3, yel, 1.5, 0.04, 1.2);
      B(g, 1.3, 0.05, 1.1, yel, -0.75, 0.04, -0.25);
      B(g, 1.1, 0.05, 0.9, grn2, 1.0, 0.04, 0.05);
      CYL(g, 0.38, 0.36, 2.0, yel, 0, 0.04, -1.1, 12);           // banda de camo sobre el lomo
      FIN(g, 1.65, 1.5, 0.6, 1.15, 0.11, grn, 0.16, 2.05);       // deriva alta y en flecha
      B(g, 0.13, 0.36, 0.5, ACCENT, 0, 1.62, 2.35);
      DOME(g, 0.30, CANOPY, 0, 0.44, -1.85, 0.85, 0.85, 2.0);
      CYL(g, 0.27, 0.32, 1.5, grn, 0, 0.26, -1.6, 10);
      CYL(g, 0.26, 0.28, 1.7, yel, -0.56, 0.12, -0.6, 8);       // tomas laterales semicirculares
      CYL(g, 0.26, 0.28, 1.7, yel, 0.56, 0.12, -0.6, 8);
      CYL(g, 0.18, 0.18, 0.3, '#221d15', -0.60, 0.12, -1.42, 8);
      CYL(g, 0.18, 0.18, 0.3, '#221d15', 0.60, 0.12, -1.42, 8);
      nozzle(g, 0.33, 3.0, yel, '#241f18');
      return g;
    }

    // SUPER ETENDARD (esquema Aeronavale): ala MEDIA en flecha con punta cortada, estabilizador
    // BAJO sobre el fuselaje, morro largo de radar y sonda de reabastecimiento sobre la nariz.
    function modelSuperE() {
      const g = new THREE.Group();
      const blu = '#4d5b66', blu2 = '#3e4b56', lite = '#7b8a94', belly = '#c3cad0';
      CYL(g, 0.40, 0.38, 5.0, blu, 0, 0, 0.1, 12);
      CONE(g, 0.38, 2.0, blu, 0, 0, -3.4, false, 12);             // morro largo de radar
      CYL(g, 0.09, 0.07, 1.1, '#2d353c', 0, 0.36, -3.3, 6);       // sonda de reabastecimiento
      WING(g, 5.0, 2.2, 0.9, 1.5, 0.17, blu2, 0.02, 0.55);        // ala media en flecha
      WING(g, 5.0, 2.2, 0.9, 1.5, 0.03, belly, -0.055, 0.55);
      B(g, 1.6, 0.05, 0.9, lite, -1.35, 0.20, 0.45);   // franja clara sobre el ala (techo en 0.19)
      WING(g, 2.4, 0.9, 0.45, 0.5, 0.13, blu2, 0.5, 2.15);        // estabilizador BAJO
      FIN(g, 1.45, 1.3, 0.55, 0.95, 0.11, blu, 0.14, 2.15);
      B(g, 0.13, 0.34, 0.5, ACCENT, 0, 1.38, 2.4);
      DOME(g, 0.33, CANOPY, 0, 0.42, -1.6, 0.85, 0.8, 1.9);
      CYL(g, 0.30, 0.34, 1.4, blu, 0, 0.22, -1.45, 10);
      CYL(g, 0.27, 0.29, 1.5, lite, -0.60, 0.12, -0.5, 8);
      CYL(g, 0.27, 0.29, 1.5, lite, 0.60, 0.12, -0.5, 8);
      CYL(g, 0.19, 0.19, 0.3, '#1a2026', -0.64, 0.12, -1.22, 8);
      CYL(g, 0.19, 0.19, 0.3, '#1a2026', 0.64, 0.12, -1.22, 8);
      tank(g, 0.18, 1.6, blu2, -1.5, -0.30, 0.5);                 // el Exocet / tanque bajo el ala
      tank(g, 0.18, 1.6, blu2, 1.5, -0.30, 0.5);
      nozzle(g, 0.34, 2.75, lite, '#1e252b');
      return g;
    }

    // PAMPA IA-63 (entrenador): ala ALTA RECTA sin flecha, biplaza en tandem (cabina larga),
    // cola convencional. Es el unico del roster que no es de combate puro y tiene que notarse.
    function modelPampa() {
      const g = new THREE.Group();
      // el Pampa del juego va GRIS con camuflaje VERDE (no el blanco de escuela); el naranja
      // queda solo como marca de puntas y deriva.
      const gry = '#8e979e', grn = '#55663d', org = '#e07030', dk = '#6d767d';
      CYL(g, 0.38, 0.35, 4.6, gry, 0, 0, 0.1, 12);
      CONE(g, 0.35, 1.5, gry, 0, 0, -3.0, false, 12);
      WING(g, 5.3, 1.35, 1.0, 0.15, 0.17, gry, 0.30, 0.35);       // ala ALTA y RECTA (sin flecha)
      B(g, 1.9, 0.05, 1.15, grn, -1.15, 0.475, 0.35);             // camo VERDE sobre el ala gris
      B(g, 1.5, 0.05, 1.0, grn, 1.3, 0.475, 0.35);
      B(g, 0.75, 0.06, 1.25, org, -2.2, 0.475, 0.35);             // puntas naranjas (marca de escuela)
      B(g, 0.75, 0.06, 1.25, org, 2.2, 0.475, 0.35);
      CYL(g, 0.39, 0.36, 1.9, grn, 0, 0, -1.0, 12);               // banda verde sobre el lomo
      WING(g, 2.4, 0.85, 0.55, 0.3, 0.13, gry, 0.36, 2.0);
      B(g, 0.6, 0.06, 0.7, org, -1.05, 0.435, 2.0);
      B(g, 0.6, 0.06, 0.7, org, 1.05, 0.435, 2.0);
      FIN(g, 1.3, 1.15, 0.6, 0.7, 0.11, gry, 0.14, 1.95);
      B(g, 0.13, 0.45, 0.8, org, 0, 1.2, 2.0);                    // banda naranja de la deriva
      DOME(g, 0.36, CANOPY, 0, 0.44, -1.2, 0.8, 0.8, 2.6);        // cabina LARGA (biplaza)
      CYL(g, 0.30, 0.34, 1.5, gry, 0, 0.22, -1.1, 10);
      CYL(g, 0.25, 0.27, 1.3, gry, -0.56, 0.18, -0.35, 8);
      CYL(g, 0.25, 0.27, 1.3, gry, 0.56, 0.18, -0.35, 8);
      CYL(g, 0.17, 0.17, 0.3, '#282d33', -0.60, 0.18, -0.98, 8);
      CYL(g, 0.17, 0.17, 0.3, '#282d33', 0.60, 0.18, -0.98, 8);
      B(g, 0.85, 0.10, 0.45, org, 0, 0.20, -2.5);                 // franja naranja del morro
      nozzle(g, 0.30, 2.5, gry, '#2b3036');
      return g;
    }

    // MIRAGE IIIEA (camo verde/marron de la FAA): misma familia que el Dagger, pero con el morro
    // de RADAR mas voluminoso y el camo argentino. Delta puro, sin estabilizador.
    function modelMirage() {
      const g = new THREE.Group();
      const grn = '#55673c', dgrn = '#3d4a30', tan = '#a89468', belly = '#98a5ac';
      CYL(g, 0.36, 0.34, 5.6, grn, 0, 0.04, 0.1, 12);
      CONE(g, 0.35, 1.7, grn, 0, 0.04, -3.35, false, 12);
      CYL(g, 0.22, 0.14, 0.7, tan, 0, 0.04, -4.35, 10);           // radomo del morro
      WING(g, 6.1, 4.7, 0.35, 4.0, 0.17, grn, -0.14, 0.95);       // DELTA puro
      WING(g, 6.1, 4.7, 0.35, 4.0, 0.03, belly, -0.215, 0.95);
      // camo FAA: VERDE + MARRON CLARO ARENA, a y=0.04 (techo del delta en 0.03)
      B(g, 2.1, 0.05, 1.5, tan, -1.45, 0.04, 0.95);
      B(g, 1.7, 0.05, 1.25, tan, 1.55, 0.04, 1.2);
      B(g, 1.3, 0.05, 1.0, tan, -0.75, 0.04, -0.2);
      B(g, 1.1, 0.05, 0.85, dgrn, 1.05, 0.04, 0.1);
      CYL(g, 0.38, 0.36, 2.1, tan, 0, 0.04, -1.0, 12);            // banda de camo sobre el lomo
      FIN(g, 1.7, 1.55, 0.6, 1.2, 0.11, grn, 0.16, 2.1);
      B(g, 0.13, 0.36, 0.5, ACCENT, 0, 1.67, 2.4);
      DOME(g, 0.30, CANOPY, 0, 0.46, -1.9, 0.85, 0.85, 2.0);
      CYL(g, 0.27, 0.32, 1.5, grn, 0, 0.28, -1.65, 10);
      CYL(g, 0.26, 0.28, 1.7, dgrn, -0.56, 0.12, -0.65, 8);
      CYL(g, 0.26, 0.28, 1.7, dgrn, 0.56, 0.12, -0.65, 8);
      CYL(g, 0.18, 0.18, 0.3, '#1e2318', -0.60, 0.12, -1.47, 8);
      CYL(g, 0.18, 0.18, 0.3, '#1e2318', 0.60, 0.12, -1.47, 8);
      tank(g, 0.17, 1.5, dgrn, -1.5, -0.36, 0.6);
      tank(g, 0.17, 1.5, dgrn, 1.5, -0.36, 0.6);
      nozzle(g, 0.33, 3.05, dgrn, '#20261f');
      return g;
    }

    const MODELS = {
      sky: () => modelA4('#4e5c38', '#59683f', '#7a5c33', '#a6aeb3'),   // FAA: camo MARRON + VERDE
      dagger: modelDagger,
      supere: modelSuperE,
      a4q: () => modelA4('#b4bcc2', '#c2c9ce', '#9aa4ab', '#dfe3e6'),   // Armada: PLATEADO / gris claro
      pampa: modelPampa,
      mirage: modelMirage,
    };

    // hornea todos los sheets; devuelve { key: dataURL_png }
    function __bake() {
      const R = makeRenderer(), cam = makeCam();
      const outEl = document.getElementById('out');
      const result = {};
      for (const key in MODELS) {
        const sc = makeScene();
        const model = MODELS[key]();
        sc.add(model);
        const sheet = document.createElement('canvas');
        sheet.width = FW * ANGLES.length; sheet.height = FH * PITCHES.length;
        const x2 = sheet.getContext('2d');
        PITCHES.forEach((pa, row) => {
          model.rotation.x = pa * Math.PI / 180;
          ANGLES.forEach((a, i) => {
            model.rotation.z = a * Math.PI / 180;
            R.render(sc, cam);
            x2.drawImage(R.domElement, i * FW, row * FH);
          });
        });
        result[key] = sheet.toDataURL('image/png');
        if (outEl) {   // vista previa (modo browser)
          const h = document.createElement('h2'); h.textContent = key + ' — ' + ANGLES.length + 'x' + PITCHES.length + ' frames de ' + FW + 'x' + FH + ' (filas: trepa/nivel/pica)';
          const big = document.createElement('canvas'); big.className = 'sheet';
          big.width = sheet.width * 4; big.height = sheet.height * 4;
          const bx = big.getContext('2d'); bx.imageSmoothingEnabled = false;
          bx.drawImage(sheet, 0, 0, big.width, big.height);
          outEl.appendChild(h); outEl.appendChild(big);
        }
      }
      return result;
    }
    window.__bake = __bake;
    if (!navigator.userAgent.includes('Electron')) __bake();   // en browser: hornear y mostrar
  </script>
